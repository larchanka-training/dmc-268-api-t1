openapi: 3.1.0
info:
  title: PR Review API
  version: 0.1.0
  description: >
    Контракт Backend API для запуска автоматического ревью Pull Request
    и получения состояния и результатов.

paths:
  /reviews:
    post:
      summary: Создать задачу ревью
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "202":
          description: ReviewJob создан и поставлен в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJob"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: Получить список задач ревью
      operationId: listReviews
      responses:
        "200":
          description: Список ReviewJob
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewJob"

  /reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Получить состояние ReviewJob
      operationId: getReview
      responses:
        "200":
          description: Текущее состояние задачи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJob"
        "404":
          description: ReviewJob не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reviews/{reviewId}/findings:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Получить результаты ревью
      operationId: getReviewFindings
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
        "404":
          description: ReviewJob не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Provider"
    post:
      summary: Принять webhook-доставку от хостинга и поставить ревью в очередь
      operationId: receiveWebhook
      responses:
        "202":
          description: Доставка принята, ReviewJob создан или найден существующий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJob"
        "401":
          description: Подпись доставки не прошла проверку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Для этого коммита уже есть нетерминальный ReviewJob
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  parameters:
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string

  schemas:
    Provider:
      type: string
      enum:
        - github
        - gitlab

    TriggerSource:
      type: string
      enum:
        - webhook
        - manual
        - mention

    CreateReviewRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - providerRepositoryId
        - pullRequestNumber
        - trigger
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        providerRepositoryId:
          type: string
          description: Идентификатор репозитория у провайдера (repositories.provider_id).
          example: "123456789"
        pullRequestNumber:
          type: integer
          minimum: 1
          example: 123
        trigger:
          $ref: "#/components/schemas/TriggerSource"

    ReviewStatus:
      type: string
      enum:
        - queued
        - building_context
        - analysing
        - publishing
        - completed
        - failed
        - cancelled

    ReviewJob:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - providerRepositoryId
        - pullRequestNumber
        - trigger
        - status
        - findingsCount
        - rejectedFindings
        - createdAt
        - updatedAt
        - lastProgressAt
        - error
      properties:
        id:
          type: string
          description: reviewRunId.
        provider:
          $ref: "#/components/schemas/Provider"
        providerRepositoryId:
          type: string
        pullRequestNumber:
          type: integer
          minimum: 1
        trigger:
          $ref: "#/components/schemas/TriggerSource"
        headCommitSha:
          type:
            - string
            - "null"
        baseCommitSha:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        findingsCount:
          type: integer
          minimum: 0
        rejectedFindings:
          type: integer
          minimum: 0
        model:
          type:
            - string
            - "null"
        tokensUsed:
          type:
            - integer
            - "null"
          minimum: 0
        durationSeconds:
          type:
            - number
            - "null"
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastProgressAt:
          type: string
          format: date-time
          description: Обновляется на каждом переходе состояния; используется для выявления зависших прогонов (§7.5 PIPELINE_SPEC.md).
        error:
          oneOf:
            - $ref: "#/components/schemas/ReviewError"
            - type: "null"

    Finding:
      type: object
      additionalProperties: false
      required:
        - filePath
        - side
        - line
        - category
        - severity
        - title
        - explanation
        - confidence
      properties:
        filePath:
          type: string
        side:
          type: string
          description: Сторона диффа, к которой относится line (findings.side).
          enum:
            - old
            - new
        line:
          type: integer
          minimum: 1
          description: >
            Номер строки на указанной side. Диапазоны (endLine) в v1 не поддерживаются —
            в схеме БД на сторону диффа хранится одна строка.
        category:
          type: string
          enum:
            - security
            - correctness
            - performance
            - readability
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        title:
          type: string
          maxLength: 200
        explanation:
          type: string
        confidence:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        suggestion:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - diff
              properties:
                diff:
                  type: string
            - type: "null"

    ReviewError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - provider
        - providerAttempt
      properties:
        code:
          type: string
          enum:
            - SCM_AUTH_ERROR
            - PR_NOT_FOUND
            - REPOSITORY_NOT_FOUND
            - SCM_UNAVAILABLE
            - CONTEXT_PARSING_ERROR
            - LLM_RATE_LIMITED
            - LLM_TIMEOUT
            - LLM_UNAVAILABLE
            - LLM_INVALID_OUTPUT
            - REVIEW_RUN_STALE
            - INTERNAL_ERROR
        message:
          type: string
        retryable:
          type: boolean
        provider:
          description: Заполнено для SCM_AUTH_ERROR/SCM_UNAVAILABLE, иначе null.
          oneOf:
            - $ref: "#/components/schemas/Provider"
            - type: "null"
        providerAttempt:
          type:
            - integer
            - "null"
          minimum: 1
          description: Попытка вызова LLM/SCM провайдера. Не путать с redelivery сообщения в очереди.

    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
