openapi: 3.1.0
info:
  title: PR Review API
  version: 0.1.0
  description: >
    Контракт Backend API для запуска автоматического ревью Pull Request
    и получения состояния и результатов.

servers:
  - url: /api/v1
    description: >
      Все пути ниже — относительно /api/v1. Префикс ставит само приложение, а не
      reverse-proxy: контракт не зависит от того, срезает ли прокси префикс.
      Фронт ходит на /api/v1/..., хостинг шлёт вебхуки на /api/v1/webhooks/{provider}.

paths:
  /reviews:
    post:
      summary: Создать задачу ревью
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "202":
          description: ReviewJob создан и поставлен в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJob"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Некорректный запрос (ApiError.code = VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >
            Для этого коммита уже есть нетерминальный ReviewJob
            (ApiError.code = REVIEW_ALREADY_ACTIVE). Ручной запуск видит отказ явно;
            вебхук на тот же случай отвечает 202, см. POST /webhooks/{provider}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      summary: Получить список задач ревью
      operationId: listReviews
      responses:
        "200":
          description: Список ReviewJob
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewJob"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Получить состояние ReviewJob
      operationId: getReview
      responses:
        "200":
          description: Текущее состояние задачи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJob"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ReviewJob не найден (ApiError.code = REVIEW_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reviews/{reviewId}/events:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Поток событий статуса прогона (Server-Sent Events)
      operationId: streamReviewEvents
      description: |
        Первое событие после подключения — `status` со снимком текущего состояния,
        дальше — по событию `status` на каждую смену статуса и `ping` в тишине,
        не реже раза в 15 секунд. После терминального статуса сервер закрывает
        поток. Поток начинается со строки `retry: 3000`. Поток отражает состояние,
        а не журнал: несколько переходов между проверками приходят одним событием.

        Поля события — в `snake_case`, как их отдаёт сервер:

            event: status
            data: {"review_run_id":"…","status":"analysing","last_progress_at":"2026-10-11T10:00:00Z","failed_stage":null,"failure_reason":null}

            event: ping
            data: {}
      responses:
        "200":
          description: Поток событий; данные события `status` — ReviewRunStatusEvent
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              description: Отключает буферизацию ответа в nginx.
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ReviewJob не найден (ApiError.code = REVIEW_NOT_FOUND); поток не открывается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reviews/{reviewId}/findings:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Получить результаты ревью
      operationId: getReviewFindings
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ReviewJob не найден (ApiError.code = REVIEW_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Provider"
    post:
      summary: Принять webhook-доставку от хостинга и поставить ревью в очередь
      description: >
        Без сессии и без проверки Origin: доставку подтверждает подпись.
      security: []
      operationId: receiveWebhook
      responses:
        "202":
          description: >
            Доставка принята: ReviewJob создан или, если для этого коммита уже есть
            нетерминальный, возвращён существующий. Дубль — не ошибка: не-2xx
            хостинг считает неудачной доставкой, повторяет её и после серии отказов
            может отключить вебхук, поэтому 409 здесь не отдаём. Доставка, которая
            ревью не запускает, — тоже 202, но с телом WebhookIgnored: записей нет,
            очередь не тронута (спека webhook-intake).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReviewJob"
                  - $ref: "#/components/schemas/WebhookIgnored"
        "401":
          description: Подпись доставки не прошла проверку (ApiError.code = WEBHOOK_SIGNATURE_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >
            VCS недоступен или ответил ошибкой при получении диффа или метаданных;
            прогон не создан и задача не поставлена (ApiError.code = SCM_UNAVAILABLE).
            Ответ обязан спекой webhook-intake: сбой VCS — 502, а не прочий 5xx.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "501":
          description: >
            Провайдер есть в enum Provider, но приёмник вебхуков для него ещё
            не написан (ApiError.code = PROVIDER_NOT_SUPPORTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/{provider}/login:
    parameters:
      - $ref: "#/components/parameters/AuthProvider"
    get:
      summary: Начать вход через провайдера
      description: >
        Открыт без сессии. Ставит cookie oauth_state со state и проверенным
        redirect и перенаправляет на страницу авторизации провайдера. redirect
        принимается, только если это путь под /app/ не длиннее 1000 байт в UTF-8;
        иначе после входа — /app/.
      operationId: startLogin
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          schema:
            type: string
          example: /app/reviews/42
      responses:
        "302":
          description: Редирект на страницу авторизации провайдера с параметром state.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
                example: "oauth_state=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=600"
        "404":
          description: Неизвестный провайдер.

  /auth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/AuthProvider"
    get:
      summary: Завершить вход
      description: >
        Сюда провайдер возвращает браузер. Открыт без сессии. state сверяется с
        cookie oauth_state, code обменивается на профиль, пользователь находится
        или создаётся, создаётся сессия. Любая ошибка — редирект на
        /login?error=<код>: state_mismatch, denied, provider_unavailable.
      operationId: completeLogin
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Код ошибки провайдера; access_denied — пользователь отказал.
          schema:
            type: string
      responses:
        "302":
          description: >
            Успех — редирект на redirect из oauth_state или на /app/ и cookie session.
            Ошибка — редирект на /login?error=<код>, сессии нет. oauth_state
            удаляется в обоих случаях.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
                example: "session=...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=2592000"
        "404":
          description: Неизвестный провайдер.

  /auth/me:
    get:
      summary: Пользователь текущей сессии
      operationId: getCurrentUser
      responses:
        "200":
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: >
            Нет действительной сессии (ApiError.code = UNAUTHENTICATED). Пришедшая
            недействительная cookie session удаляется в том же ответе.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      summary: Выйти
      description: >
        Удаляет сессию текущей cookie: следующий запрос с ней из любой вкладки
        получает 401. Идемпотентен: без cookie и с cookie неизвестной сессии тоже
        204, cookie session удаляется. Сессия не нужна, проверяется только Origin.
      operationId: logout
      responses:
        "204":
          description: Сессия удалена, cookie session удалена.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "session=\"\"; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0"
        "403":
          description: >
            Origin отсутствует или не совпадает с адресом сервиса
            (ApiError.code = ORIGIN_FORBIDDEN); сессия не удалена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  parameters:
    AuthProvider:
      name: provider
      in: path
      required: true
      description: Провайдер входа; сейчас только github, неизвестный — 404.
      schema:
        type: string
        enum:
          - github
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string

  schemas:
    Provider:
      type: string
      enum:
        - github
        - gitlab

    TriggerSource:
      type: string
      enum:
        - webhook
        - manual
        - mention

    CreateReviewRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - providerRepositoryId
        - pullRequestNumber
        - trigger
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        providerRepositoryId:
          type: string
          description: Идентификатор репозитория у провайдера (repositories.provider_id).
          example: "123456789"
        pullRequestNumber:
          type: integer
          minimum: 1
          example: 123
        trigger:
          $ref: "#/components/schemas/TriggerSource"

    ReviewStatus:
      type: string
      enum:
        - queued
        - building_context
        - analysing
        - publishing
        - completed
        - failed
        - cancelled

    ReviewJob:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - providerRepositoryId
        - pullRequestNumber
        - trigger
        - status
        - findingsCount
        - rejectedFindings
        - createdAt
        - updatedAt
        - lastProgressAt
        - error
      properties:
        id:
          type: string
          description: reviewRunId.
        provider:
          $ref: "#/components/schemas/Provider"
        providerRepositoryId:
          type: string
        pullRequestNumber:
          type: integer
          minimum: 1
        trigger:
          $ref: "#/components/schemas/TriggerSource"
        headCommitSha:
          type:
            - string
            - "null"
        baseCommitSha:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        findingsCount:
          type: integer
          minimum: 0
        rejectedFindings:
          type: integer
          minimum: 0
        model:
          type:
            - string
            - "null"
        tokensUsed:
          type:
            - integer
            - "null"
          minimum: 0
        durationSeconds:
          type:
            - number
            - "null"
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastProgressAt:
          type: string
          format: date-time
          description: Обновляется на каждом переходе состояния; используется для выявления зависших прогонов (§7.5 PIPELINE_SPEC.md).
        failedStage:
          type:
            - string
            - "null"
          enum:
            - building_context
            - analysing
            - publishing
            - null
          description: Этап, на котором прогон упал; null, если прогон не падал или упал из queued.
        verification:
          type:
            - string
            - "null"
          enum:
            - verified
            - not_required
            - unavailable
            - null
          description: >
            Итог второго прохода модели (Reflection Pass): verified - вердикты применены,
            not_required - замечаний после отсева не осталось, unavailable - верификатор
            упал или ответил не по схеме, опубликованы замечания после отсева; null до конца анализа.
        verifierDroppedFindings:
          type: integer
          minimum: 0
          description: Сколько замечаний отбросил верификатор.
        error:
          oneOf:
            - $ref: "#/components/schemas/ReviewError"
            - type: "null"

    ReviewRunStatusEvent:
      type: object
      description: Данные события `status` потока `/reviews/{reviewId}/events`.
      additionalProperties: false
      required:
        - review_run_id
        - status
        - last_progress_at
        - failed_stage
        - failure_reason
      properties:
        review_run_id:
          type: string
        status:
          $ref: "#/components/schemas/ReviewStatus"
        last_progress_at:
          type: string
          format: date-time
        failed_stage:
          type:
            - string
            - "null"
          enum:
            - building_context
            - analysing
            - publishing
            - null
        failure_reason:
          type:
            - string
            - "null"

    Finding:
      type: object
      additionalProperties: false
      required:
        - filePath
        - side
        - line
        - category
        - severity
        - message
        - confidence
      properties:
        filePath:
          type: string
          minLength: 1
        side:
          type: string
          description: Сторона диффа, к которой относится line (findings.side).
          enum:
            - old
            - new
        line:
          type: integer
          minimum: 1
          description: >
            Номер строки на указанной side. Диапазоны (endLine) в v1 не поддерживаются —
            в схеме БД на сторону диффа хранится одна строка.
        category:
          type: string
          enum:
            - security
            - correctness
            - performance
            - readability
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        message:
          type: string
          minLength: 1
          description: Текст замечания (findings.message, соответствует Finding.message).
        confidence:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        suggestion:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - diff
              properties:
                diff:
                  type: string
            - type: "null"
        rule:
          description: >
            Пункт правила владельца (.review/rules.md), которому противоречит код;
            null - замечание по стандартным критериям.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - name
                - check
              properties:
                name:
                  type: string
                  minLength: 1
                check:
                  type: integer
                  minimum: 1
            - type: "null"

    ReviewError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - scmProvider
        - providerAttempt
      properties:
        code:
          type: string
          enum:
            - SCM_AUTH_ERROR
            - PR_NOT_FOUND
            - REPOSITORY_NOT_FOUND
            - SCM_UNAVAILABLE
            - CONTEXT_PARSING_ERROR
            - LLM_RATE_LIMITED
            - LLM_TIMEOUT
            - LLM_UNAVAILABLE
            - LLM_INVALID_OUTPUT
            - REVIEW_RUN_STALE
            - INTERNAL_ERROR
        message:
          type: string
        retryable:
          type: boolean
        scmProvider:
          description: >
            Заполнено для SCM_AUTH_ERROR/SCM_UNAVAILABLE, иначе null. Называется
            scmProvider, а не provider: поле про сторону SCM, providerAttempt считает
            попытки и LLM, и SCM.
          oneOf:
            - $ref: "#/components/schemas/Provider"
            - type: "null"
        providerAttempt:
          type:
            - integer
            - "null"
          minimum: 1
          description: Попытка вызова LLM/SCM провайдера. Не путать с redelivery сообщения в очереди.

    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >
            Закрытый список, как и ReviewError.code. Каждый ответ с ApiError называет
            свой код в description — это сверяет tests/test_docs.py.
          enum:
            - VALIDATION_ERROR
            - REVIEW_NOT_FOUND
            - REVIEW_ALREADY_ACTIVE
            - WEBHOOK_SIGNATURE_INVALID
            - SCM_UNAVAILABLE
            - PROVIDER_NOT_SUPPORTED
            - UNAUTHENTICATED
            - ORIGIN_FORBIDDEN
        message:
          type: string

    WebhookIgnored:
      type: object
      additionalProperties: false
      description: >
        Тело 202 для доставки, которая ревью не запускает: действие reopened, closed
        или неизвестное, незарегистрированный репозиторий, тело без события.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ignored

    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - provider
        - login
        - name
        - avatar_url
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        login:
          type: string
        name:
          type:
            - string
            - "null"
        avatar_url:
          type:
            - string
            - "null"

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: >
        Сессия в httpOnly cookie, ставится callback'ом входа. Изменяющие запросы
        (POST, PUT, PATCH, DELETE) с сессией дополнительно сверяют Origin с адресом
        сервиса, иначе 403 ORIGIN_FORBIDDEN.

security:
  - session: []
