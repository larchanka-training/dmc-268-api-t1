openapi: 3.1.0
info:
  title: PR Review API
  version: 0.1.0
  description: >
    Контракт Backend API для запуска автоматического ревью Pull Request
    и получения состояния и результатов.

servers:
  - url: /api/v1
    description: >
      Все пути ниже — относительно /api/v1. Префикс ставит само приложение, а не
      reverse-proxy: контракт не зависит от того, срезает ли прокси префикс.
      Фронт ходит на /api/v1/..., хостинг шлёт вебхуки на /api/v1/webhooks/{provider}.

paths:
  /repositories:
    get:
      summary: Список зарегистрированных репозиториев
      description: >
        Постранично, по времени регистрации, затем по id. limit выше 200 не
        отклоняется, а приводится к 200. Общего числа записей в ответе нет: конец
        списка — страница короче limit.
      operationId: listRepositories
      tags:
        - repositories
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница репозиториев
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /repositories/{repositoryId}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/RepositoryId"
    get:
      summary: Список запросов на изменение репозитория
      description: >
        Постранично, по номеру запроса на изменение. Пагинация та же, что у
        GET /repositories. Списка запросов на изменение по всем репозиториям нет.
      operationId: listPullRequests
      tags:
        - pull-requests
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница запросов на изменение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestList"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            Репозитория нет. Тело — HTTPError (`{"detail": "repository not found"}`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /reviews:
    post:
      summary: Создать задачу ревью
      description: >
        Не реализовано: роута в app/api нет, требования в openspec/specs нет, задачи
        тоже. Операция оставлена как план ручного запуска (PIPELINE_SPEC.md §4);
        сейчас ревью запускает только вебхук.
      operationId: createReview
      x-not-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "202":
          description: ReviewJob создан и поставлен в очередь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewJob"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Некорректный запрос (ApiError.code = VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >
            Для этого коммита уже есть нетерминальный ReviewJob
            (ApiError.code = REVIEW_ALREADY_ACTIVE). Ручной запуск видит отказ явно;
            вебхук на тот же случай отвечает 202, см. POST /webhooks/{provider}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Получить прогон ревью вместе с находками
      description: >
        Один ответ, а не два эндпоинта: прогон и все его находки (спека
        review-rest-api). Находки идут в стабильном порядке — по времени создания,
        затем по id. Прогон без находок — 200 с пустым findings. Поля — в snake_case,
        как их отдаёт сервер.
      operationId: getReview
      responses:
        "200":
          description: Прогон и его находки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRun"
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /reviews/{reviewId}/events:
    parameters:
      - $ref: "#/components/parameters/ReviewId"
    get:
      summary: Поток событий статуса прогона (Server-Sent Events)
      operationId: streamReviewEvents
      description: |
        Первое событие после подключения — `status` со снимком текущего состояния,
        дальше — по событию `status` на каждую смену статуса и `ping` в тишине,
        не реже раза в 15 секунд. После терминального статуса сервер закрывает
        поток. Поток начинается со строки `retry: 3000`. Поток отражает состояние,
        а не журнал: несколько переходов между проверками приходят одним событием.

        Поля события — в `snake_case`, как их отдаёт сервер:

            event: status
            data: {"review_run_id":"…","status":"analysing","last_progress_at":"2026-10-11T10:00:00Z","failed_stage":null,"failure_reason":null}

            event: ping
            data: {}
      responses:
        "200":
          description: Поток событий; данные события `status` — ReviewRunStatusEvent
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              description: Отключает буферизацию ответа в nginx.
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Нет действительной сессии (ApiError.code = UNAUTHENTICATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >
            Прогон не найден, поток не открывается. Тело — HTTPError (`{"detail": "review run not found"}`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Provider"
    post:
      summary: Принять webhook-доставку от хостинга и поставить ревью в очередь
      description: >
        Без сессии и без проверки Origin: доставку подтверждает подпись.
      security: []
      operationId: receiveWebhook
      responses:
        "202":
          description: >
            Доставка принята: ReviewJob создан или, если для этого коммита уже есть
            нетерминальный, возвращён существующий. Дубль — не ошибка: не-2xx
            хостинг считает неудачной доставкой, повторяет её и после серии отказов
            может отключить вебхук, поэтому 409 здесь не отдаём. Доставка, которая
            ревью не запускает, — тоже 202, но с телом WebhookIgnored: записей нет,
            очередь не тронута (спека webhook-intake). Событие
            pull_request_review_thread — 202 с телом WebhookAcknowledged.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReviewJob"
                  - $ref: "#/components/schemas/WebhookIgnored"
                  - $ref: "#/components/schemas/WebhookAcknowledged"
        "401":
          description: Подпись доставки не прошла проверку (ApiError.code = WEBHOOK_SIGNATURE_INVALID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: >
            VCS недоступен или ответил ошибкой при получении диффа или метаданных;
            прогон не создан и задача не поставлена (ApiError.code = SCM_UNAVAILABLE).
            Ответ обязан спекой webhook-intake: сбой VCS — 502, а не прочий 5xx.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "501":
          description: >
            Провайдер есть в enum Provider, но приёмник вебхуков для него ещё
            не написан (ApiError.code = PROVIDER_NOT_SUPPORTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /auth/{provider}/login:
    parameters:
      - $ref: "#/components/parameters/AuthProvider"
    get:
      summary: Начать вход через провайдера
      description: >
        Открыт без сессии. Ставит cookie oauth_state со state и проверенным
        redirect и перенаправляет на страницу авторизации провайдера. redirect
        принимается, только если это путь под /app/ не длиннее 1000 байт в UTF-8;
        иначе после входа — /app/.
      operationId: startLogin
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          schema:
            type: string
          example: /app/reviews/42
      responses:
        "302":
          description: >
            Редирект на страницу авторизации провайдера с параметром state. Если вход
            у провайдера не настроен (пусты идентификатор приложения или публичный
            адрес сервиса) — редирект на /login?error=provider_unavailable без cookie.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
                example: "oauth_state=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=600"
        "404":
          description: Неизвестный провайдер.

  /auth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/AuthProvider"
    get:
      summary: Завершить вход
      description: >
        Сюда провайдер возвращает браузер. Открыт без сессии. state сверяется с
        cookie oauth_state, code обменивается на профиль, пользователь находится
        или создаётся, создаётся сессия. Любая ошибка — редирект на
        /login?error=<код>: state_mismatch, denied, provider_unavailable.
      operationId: completeLogin
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Код ошибки провайдера; access_denied — пользователь отказал.
          schema:
            type: string
      responses:
        "302":
          description: >
            Успех — редирект на redirect из oauth_state или на /app/ и cookie session.
            Ошибка — редирект на /login?error=<код>, сессии нет. oauth_state
            удаляется в обоих случаях.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
                example: "session=...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=2592000"
        "404":
          description: Неизвестный провайдер.

  /auth/me:
    get:
      summary: Пользователь текущей сессии
      operationId: getCurrentUser
      responses:
        "200":
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: >
            Нет действительной сессии (ApiError.code = UNAUTHENTICATED). Пришедшая
            недействительная cookie session удаляется в том же ответе.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      summary: Выйти
      description: >
        Удаляет сессию текущей cookie: следующий запрос с ней из любой вкладки
        получает 401. Идемпотентен: без cookie и с cookie неизвестной сессии тоже
        204, cookie session удаляется. Сессия не нужна, проверяется только Origin.
      operationId: logout
      responses:
        "204":
          description: Сессия удалена, cookie session удалена.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "session=\"\"; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0"
        "403":
          description: >
            Origin отсутствует или не совпадает с адресом сервиса
            (ApiError.code = ORIGIN_FORBIDDEN); сессия не удалена.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  parameters:
    AuthProvider:
      name: provider
      in: path
      required: true
      description: Провайдер входа; сейчас только github, неизвестный — 404.
      schema:
        type: string
        enum:
          - github
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: Идентификатор прогона ревью (review_runs.id); не UUID — 422.
      schema:
        type: string
        format: uuid
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      description: Идентификатор репозитория в сервисе (repositories.id); не UUID — 422.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы. Больше 200 приводится к 200, меньше 1 — 422.
      schema:
        type: integer
        minimum: 1
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    NotFound:
      description: >
        Прогон не найден. Тело — HTTPError (`{"detail": "review run not found"}`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPError"
    ValidationFailed:
      description: >
        Параметр пути или запроса не прошёл проверку FastAPI (не UUID, limit меньше 1,
        provider вне Provider). Тело — HTTPValidationError, не ApiError.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"

  schemas:
    Provider:
      type: string
      enum:
        - github
        - gitlab

    TriggerSource:
      type: string
      enum:
        - webhook
        - manual
        - mention

    CreateReviewRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - providerRepositoryId
        - pullRequestNumber
        - trigger
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        providerRepositoryId:
          type: string
          description: Идентификатор репозитория у провайдера (repositories.provider_id).
          example: "123456789"
        pullRequestNumber:
          type: integer
          minimum: 1
          example: 123
        trigger:
          $ref: "#/components/schemas/TriggerSource"

    ReviewStatus:
      type: string
      enum:
        - queued
        - building_context
        - analysing
        - publishing
        - completed
        - failed
        - cancelled

    ReviewJob:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - providerRepositoryId
        - pullRequestNumber
        - trigger
        - status
        - findingsCount
        - rejectedFindings
        - createdAt
        - updatedAt
        - lastProgressAt
        - error
      properties:
        id:
          type: string
          description: reviewRunId.
        provider:
          $ref: "#/components/schemas/Provider"
        providerRepositoryId:
          type: string
        pullRequestNumber:
          type: integer
          minimum: 1
        trigger:
          $ref: "#/components/schemas/TriggerSource"
        headCommitSha:
          type:
            - string
            - "null"
        baseCommitSha:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        findingsCount:
          type: integer
          minimum: 0
        rejectedFindings:
          type: integer
          minimum: 0
        model:
          type:
            - string
            - "null"
        tokensUsed:
          type:
            - integer
            - "null"
          minimum: 0
        durationSeconds:
          type:
            - number
            - "null"
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastProgressAt:
          type: string
          format: date-time
          description: Обновляется на каждом переходе состояния; используется для выявления зависших прогонов (§7.5 PIPELINE_SPEC.md).
        failedStage:
          type:
            - string
            - "null"
          enum:
            - building_context
            - analysing
            - publishing
            - null
          description: Этап, на котором прогон упал; null, если прогон не падал или упал из queued.
        error:
          oneOf:
            - $ref: "#/components/schemas/ReviewError"
            - type: "null"

    ReviewRunStatusEvent:
      type: object
      description: Данные события `status` потока `/reviews/{reviewId}/events`.
      additionalProperties: false
      required:
        - review_run_id
        - status
        - last_progress_at
        - failed_stage
        - failure_reason
      properties:
        review_run_id:
          type: string
        status:
          $ref: "#/components/schemas/ReviewStatus"
        last_progress_at:
          type: string
          format: date-time
        failed_stage:
          type:
            - string
            - "null"
          enum:
            - building_context
            - analysing
            - publishing
            - null
        failure_reason:
          type:
            - string
            - "null"

    Finding:
      type: object
      description: >
        Находка на выходе модели (finding.schema.json, llm_review_output.schema.json).
        В ответах REST не отдаётся: GET /reviews/{reviewId} возвращает ReviewRunFinding.
      additionalProperties: false
      required:
        - filePath
        - side
        - line
        - category
        - severity
        - message
        - confidence
      properties:
        filePath:
          type: string
          minLength: 1
        side:
          type: string
          description: Сторона диффа, к которой относится line (findings.side).
          enum:
            - old
            - new
        line:
          type: integer
          minimum: 1
          description: >
            Номер строки на указанной side. Диапазоны (endLine) в v1 не поддерживаются —
            в схеме БД на сторону диффа хранится одна строка.
        category:
          type: string
          enum:
            - security
            - correctness
            - performance
            - readability
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        message:
          type: string
          minLength: 1
          description: Текст замечания (findings.message, соответствует Finding.message).
        confidence:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        suggestion:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - diff
              properties:
                diff:
                  type: string
            - type: "null"

    ReviewError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - scmProvider
        - providerAttempt
      properties:
        code:
          type: string
          enum:
            - SCM_AUTH_ERROR
            - PR_NOT_FOUND
            - REPOSITORY_NOT_FOUND
            - SCM_UNAVAILABLE
            - CONTEXT_PARSING_ERROR
            - LLM_RATE_LIMITED
            - LLM_TIMEOUT
            - LLM_UNAVAILABLE
            - LLM_INVALID_OUTPUT
            - REVIEW_RUN_STALE
            - INTERNAL_ERROR
        message:
          type: string
        retryable:
          type: boolean
        scmProvider:
          description: >
            Заполнено для SCM_AUTH_ERROR/SCM_UNAVAILABLE, иначе null. Называется
            scmProvider, а не provider: поле про сторону SCM, providerAttempt считает
            попытки и LLM, и SCM.
          oneOf:
            - $ref: "#/components/schemas/Provider"
            - type: "null"
        providerAttempt:
          type:
            - integer
            - "null"
          minimum: 1
          description: Попытка вызова LLM/SCM провайдера. Не путать с redelivery сообщения в очереди.

    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >
            Закрытый список, как и ReviewError.code. Каждый ответ с ApiError называет
            свой код в description — это сверяет tests/test_docs.py. 404 и 422 ручек
            чтения отдаются не ApiError, а телами FastAPI: HTTPError и HTTPValidationError.
          enum:
            - VALIDATION_ERROR
            - REVIEW_ALREADY_ACTIVE
            - WEBHOOK_SIGNATURE_INVALID
            - SCM_UNAVAILABLE
            - PROVIDER_NOT_SUPPORTED
            - UNAUTHENTICATED
            - ORIGIN_FORBIDDEN
        message:
          type: string

    WebhookIgnored:
      type: object
      additionalProperties: false
      description: >
        Тело 202 для доставки, которая ревью не запускает: действие reopened, closed
        или неизвестное, незарегистрированный репозиторий, тело без события.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ignored

    WebhookAcknowledged:
      type: object
      additionalProperties: false
      description: >
        Тело 202 для события pull_request_review_thread: отметка закрытия треда
        принята (спека webhook-intake, «Вебхук закрытия треда ревью»).
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - acknowledged

    HTTPError:
      type: object
      description: Тело HTTPException FastAPI — 404 ручек чтения и входа.
      required:
        - detail
      properties:
        detail:
          type: string

    HTTPValidationError:
      type: object
      description: Тело 422 FastAPI при ошибке проверки параметров.
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            type: object
            required:
              - loc
              - msg
              - type
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

    Repository:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - provider_id
        - full_name
        - default_branch
        - auto_review_enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Provider"
        provider_id:
          type: string
          description: Идентификатор репозитория у провайдера.
        full_name:
          type: string
          example: octo/hello
        default_branch:
          type: string
        auto_review_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RepositoryList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"

    PullRequestState:
      type: string
      enum:
        - open
        - closed
        - merged

    PullRequest:
      type: object
      additionalProperties: false
      description: Запрос на изменение (merge_requests).
      required:
        - id
        - number
        - title
        - description
        - author
        - source_branch
        - target_branch
        - head_sha
        - state
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: string
        author:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        head_sha:
          type: string
        state:
          $ref: "#/components/schemas/PullRequestState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PullRequestList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequest"

    ReviewRun:
      type: object
      additionalProperties: false
      description: Ответ GET /reviews/{reviewId} — прогон и все его находки, в snake_case.
      required:
        - id
        - merge_request_id
        - head_sha
        - base_sha
        - status
        - trigger
        - model
        - tokens_used
        - duration_seconds
        - failure_reason
        - failed_stage
        - last_progress_at
        - created_at
        - updated_at
        - findings
      properties:
        id:
          type: string
          format: uuid
        merge_request_id:
          type: string
          format: uuid
        head_sha:
          type: string
        base_sha:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/ReviewStatus"
        trigger:
          $ref: "#/components/schemas/TriggerSource"
        model:
          type:
            - string
            - "null"
        tokens_used:
          type:
            - integer
            - "null"
        duration_seconds:
          type:
            - number
            - "null"
        failure_reason:
          type:
            - string
            - "null"
        failed_stage:
          type:
            - string
            - "null"
          enum:
            - building_context
            - analysing
            - publishing
            - null
        last_progress_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReviewRunFinding"

    ReviewRunFinding:
      type: object
      additionalProperties: false
      description: >
        Находка прогона в ответе GET /reviews/{reviewId} (таблица findings). Не путать
        с Finding — контрактом находки на выходе модели.
      required:
        - id
        - file_path
        - side
        - old_line
        - new_line
        - category
        - severity
        - message
        - suggestion
        - confidence
      properties:
        id:
          type: string
          format: uuid
        file_path:
          type: string
        side:
          type: string
          enum:
            - old
            - new
        old_line:
          type:
            - integer
            - "null"
        new_line:
          type:
            - integer
            - "null"
        category:
          type: string
          enum:
            - security
            - correctness
            - performance
            - readability
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        message:
          type: string
        suggestion:
          type:
            - string
            - "null"
        confidence:
          type:
            - number
            - "null"

    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - provider
        - login
        - name
        - avatar_url
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        login:
          type: string
        name:
          type:
            - string
            - "null"
        avatar_url:
          type:
            - string
            - "null"

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: >
        Сессия в httpOnly cookie, ставится callback'ом входа. Изменяющие запросы
        (POST, PUT, PATCH, DELETE) с сессией дополнительно сверяют Origin с адресом
        сервиса, иначе 403 ORIGIN_FORBIDDEN.

security:
  - session: []
