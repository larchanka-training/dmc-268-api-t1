name: Load

# Полный нагрузочный прогон конвейера ревью (change add-rules-e2e-benchmark-and-load,
# design D6): живой uvicorn, воркеры на одной очереди, поток вебхуков с
# повторными доставками; GitHub и модель - фейки с задержкой. Малый прогон
# идёт в ci.yml на каждом PR и проверяет только корректность; этот - отчёт с
# латентностью и пропускной способностью и пороги из входов. Время на раннере
# GitHub шумит, поэтому запуск вручную. На PR - только когда меняется сам
# сценарий: новый workflow с одним workflow_dispatch нельзя запустить до мерджа
# в ветку по умолчанию.
on:
  workflow_dispatch:
    inputs:
      pull_requests:
        description: Число PR (по одному вебхуку на каждый)
        default: "200"
        required: true
      redeliveries:
        description: Повторных доставок вперемешку с первыми
        default: "40"
        required: true
      senders:
        description: Одновременных отправителей вебхуков
        default: "32"
        required: true
      workers:
        description: Воркеров на очереди
        default: "8"
        required: true
      model_latency_seconds:
        description: Задержка ответа заглушки модели, с
        default: "0.5"
        required: true
      github_latency_seconds:
        description: Задержка ответа фейка GitHub, с
        default: "0.05"
        required: true
      max_intake_p95_ms:
        description: Порог p95 ответа на вебхук, мс (пусто - без порога)
        default: ""
        required: false
      max_end_to_end_p95_seconds:
        description: Порог p95 от приёма до завершения прогона, с (пусто - без порога)
        default: ""
        required: false
  pull_request:
    paths:
      - "tests/load/**"
      - ".github/workflows/load.yml"
      - ".github/actions/python-env/**"
      - "tests/strict_skips.py"

# У токена прогона только чтение: workflow ничего не пишет в репозиторий.
permissions:
  contents: read

concurrency:
  group: load-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: dmc268
          POSTGRES_PASSWORD: dmc268
          POSTGRES_DB: dmc268
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268 -d dmc268"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.4-alpine@sha256:5b70d54d53d0ce9558b84ad93cb237d06fa2e8c57115fa0ff7223b9eaffa44ed
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dmc268:dmc268@localhost:5432/dmc268
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
      # На PR входов нет, и фильтр `paths` сравнивает весь дифф PR: прогон идёт на
      # каждый пуш. Поэтому на PR уменьшенный профиль - проверка, что сценарий
      # работает; полный профиль из test_load.py - вручную.
      LOAD_PULL_REQUESTS: ${{ inputs.pull_requests || (github.event_name == 'pull_request' && '20') || '' }}
      LOAD_REDELIVERIES: ${{ inputs.redeliveries || (github.event_name == 'pull_request' && '5') || '' }}
      LOAD_SENDERS: ${{ inputs.senders }}
      LOAD_WORKERS: ${{ inputs.workers || (github.event_name == 'pull_request' && '4') || '' }}
      LOAD_MODEL_LATENCY_SECONDS: ${{ inputs.model_latency_seconds || (github.event_name == 'pull_request' && '0.05') || '' }}
      LOAD_GITHUB_LATENCY_SECONDS: ${{ inputs.github_latency_seconds }}
      LOAD_MAX_INTAKE_P95_MS: ${{ inputs.max_intake_p95_ms }}
      LOAD_MAX_END_TO_END_P95_SECONDS: ${{ inputs.max_end_to_end_p95_seconds }}
      LOAD_REPORT_DIR: load-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: pytest -m load (пропуск теста - провал)
        env:
          # Пропуск роняет прогон (tests/strict_skips.py): обычно нет сервисов
          # PostgreSQL или RabbitMQ.
          PYTEST_FAIL_ON_SKIP: "1"
        run: uv run pytest -q -rs -s -m load tests/load
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-report
          path: load-report/
          if-no-files-found: warn
