# Временная диагностика: отвечает на три вопроса про доступ к VPS и удаляется.
# Ничего не деплоит и не меняет состояние сервера — единственная команда,
# выполняемая удалённо, читает версию Docker. См.
# openspec/changes/vps-access-probe/.
name: VPS access probe

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Адрес вместо VPS_DMC268_IP_T1 — для проверки отрицательного исхода"
        required: false
        default: ""
  # Кнопка workflow_dispatch появляется только у workflow из ветки по умолчанию,
  # а мержить диагностику в develop ради запуска незачем. Ограничение по paths
  # не даёт ей срабатывать на каждый пуш ветки.
  push:
    paths:
      - ".github/workflows/vps-access-probe.yml"
      - ".github/scripts/classify-secret-kind.sh"

permissions:
  contents: read

# Одна попытка входа за раз, даже если прогонов запущено несколько.
concurrency:
  group: vps-access-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что sshpass не раскрывает значение в командной строке
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          # Маскирование GitHub закрывает только лог; аргументы процесса видны
          # любому процессу на раннере, поэтому пароль уходит через окружение.
          # Канарейка проверяет это на заведомо несекретном значении.
          SSHPASS=probe-canary-value sshpass -e sleep 5 &
          canary_pid=$!
          sleep 1
          if ps -eo args | grep -v grep | grep -q 'probe-canary-value'; then
            kill "$canary_pid" || true
            echo "::error::sshpass раскрывает значение в командной строке"
            exit 1
          fi
          kill "$canary_pid" || true
          echo "sshpass -e: значение в ps не видно"

      - name: Определить форму секрета
        id: classify
        env:
          SECRET_VALUE: ${{ secrets.VPS_DMC268_P }}
        run: |
          set -euo pipefail
          kind="$(printf '%s' "$SECRET_VALUE" | sh .github/scripts/classify-secret-kind.sh)"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Форма VPS_DMC268_P: $kind"

      - name: Подготовить known_hosts
        id: keyscan
        env:
          VPS_IP: ${{ vars.VPS_DMC268_IP_T1 }}
          HOST_OVERRIDE: ${{ inputs.host }}
        run: |
          set -euo pipefail
          host="${HOST_OVERRIDE:-$VPS_IP}"
          if [ -z "$host" ]; then
            echo "::error::не задана ни переменная VPS_DMC268_IP_T1, ни вход host"
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Ключ хоста принимается по первому подключению: диагностика ничего
          # на сервере не выполняет, кроме чтения версии Docker. В CD отпечаток
          # придётся закрепить.
          if ssh-keyscan -T 10 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Хост ответил на ssh-keyscan"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "Хост не ответил на ssh-keyscan — попытка входа не делается"
          fi

      - name: Одна попытка входа и проверка Docker
        id: probe
        if: steps.keyscan.outputs.reachable == 'true' && steps.classify.outputs.kind != 'empty'
        env:
          SECRET_VALUE: ${{ secrets.VPS_DMC268_P }}
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          HOST: ${{ steps.keyscan.outputs.host }}
          KIND: ${{ steps.classify.outputs.kind }}
        run: |
          set -uo pipefail
          umask 077
          # Один вызов отвечает сразу на оба вопроса: жив ли демон и имеет ли
          # пользователь доступ к сокету. Ничего, кроме этого, не выполняется.
          remote_cmd="docker version --format '{{.Server.Version}}'"
          rc=0
          if [ "$KIND" = key ]; then
            key_file="$(mktemp)"
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$SECRET_VALUE" > "$key_file"
            out="$(ssh -i "$key_file" \
              -o BatchMode=yes -o ConnectTimeout=10 -o NumberOfPasswordPrompts=0 \
              "$SSH_USER@$HOST" "$remote_cmd" 2>&1)" || rc=$?
          else
            export SSHPASS="$SECRET_VALUE"
            out="$(sshpass -e ssh \
              -o ConnectTimeout=10 -o NumberOfPasswordPrompts=1 \
              -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              "$SSH_USER@$HOST" "$remote_cmd" 2>&1)" || rc=$?
          fi

          # Коды 1..6 отдаёт сам sshpass (5 — неверный пароль), 255 — ssh.
          # Всё остальное означает, что вход состоялся и код принёс уже docker.
          if [ "$rc" -eq 0 ]; then
            ssh_result="ок"
            docker_result="ок, версия сервера $out"
          elif [ "$rc" -eq 255 ] || { [ "$KIND" = password ] && [ "$rc" -ge 1 ] && [ "$rc" -le 6 ]; }; then
            ssh_result="отказ (код $rc)"
            docker_result="не проверялся"
          elif [ "$rc" -eq 127 ]; then
            ssh_result="ок"
            docker_result="docker на сервере не найден"
          else
            ssh_result="ок"
            case "$out" in
              *"permission denied"*|*"Permission denied"*) docker_result="отказ в доступе к сокету для этого пользователя" ;;
              *"Cannot connect to the Docker daemon"*) docker_result="демон не отвечает" ;;
              *) docker_result="неожиданный ответ (код $rc)" ;;
            esac
          fi

          echo "ssh_result=$ssh_result" >> "$GITHUB_OUTPUT"
          echo "docker_result=$docker_result" >> "$GITHUB_OUTPUT"
          echo "SSH: $ssh_result"
          echo "Docker: $docker_result"
          echo "Вывод команды: $out"

      - name: Записать результат в summary
        if: always()
        run: |
          {
            echo "## Диагностика доступа к VPS"
            echo
            echo "| Факт | Результат |"
            echo "| --- | --- |"
            echo "| Форма \`VPS_DMC268_P\` | ${{ steps.classify.outputs.kind || 'не определена' }} |"
            echo "| Хост отвечает на \`ssh-keyscan\` | ${{ steps.keyscan.outputs.reachable || 'не проверялось' }} |"
            echo "| SSH | ${{ steps.probe.outputs.ssh_result || 'не проверялся' }} |"
            echo "| Docker | ${{ steps.probe.outputs.docker_result || 'не проверялся' }} |"
            echo
            echo "Отрицательный ответ — такой же результат, как положительный: прогон красный только при ошибке самого workflow."
          } >> "$GITHUB_STEP_SUMMARY"
