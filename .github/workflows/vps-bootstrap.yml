# Временная подготовка сервера: ставит Docker и кладёт публичный ключ CI.
# Запускается вручную, ровно один парольный вход за прогон, все шаги
# идемпотентны. Удаляется вместе с vps-access-probe после приёмки.
# См. openspec/changes/vps-bootstrap/.
name: VPS bootstrap

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Публичный ключ CI (не секрет); пусто — берётся из VPS_DMC268_CI_PUBKEY_T1"
        required: false
        default: ""
  # Кнопка workflow_dispatch работает только для ветки по умолчанию, а мержить
  # временный файл в develop ради одного прогона незачем. Поэтому ключ лежит
  # переменной репозитория (он не секрет), а запуск идёт по изменению самого
  # workflow — как у vps-access-probe.
  push:
    paths:
      - ".github/workflows/vps-bootstrap.yml"
      - ".github/scripts/render-bootstrap-script.sh"

permissions:
  contents: read

concurrency:
  group: vps-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить сервер
        id: bootstrap
        env:
          SSHPASS: ${{ secrets.VPS_DMC268_P }}
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          HOST: ${{ vars.VPS_DMC268_IP_T1 }}
          PUBLIC_KEY: ${{ inputs.public_key != '' && inputs.public_key || vars.VPS_DMC268_CI_PUBKEY_T1 }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::хост не ответил на ssh-keyscan"
            exit 1
          fi

          script_b64="$(sh .github/scripts/render-bootstrap-script.sh "$SSH_USER" "$PUBLIC_KEY" | base64 -w0)"

          # Скрипт уходит аргументом удалённой команды, а не на stdin: stdin
          # нужен самому скрипту — на нём удалённый sudo ждёт пароль, если
          # права окажутся такими, что он понадобится. В аргументе секретов
          # нет, только публичный ключ и имя пользователя.
          remote="umask 077; printf %s '$script_b64' | base64 -d > /tmp/dmc268-bootstrap.sh; bash /tmp/dmc268-bootstrap.sh; rc=\$?; rm -f /tmp/dmc268-bootstrap.sh; exit \$rc"

          rc=0
          out="$(printf '%s\n' "$SSHPASS" | sshpass -e ssh \
            -o ConnectTimeout=15 -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            "$SSH_USER@$HOST" "$remote" 2>&1)" || rc=$?

          echo "Ответ сервера:"
          printf '%s\n' "$out"

          reported_privs="$(printf '%s\n' "$out" | sed -n 's/^PRIVS=//p')"
          if [ -z "$reported_privs" ]; then
            echo "ssh=отказ или скрипт не отработал (код $rc)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ssh=ок" >> "$GITHUB_OUTPUT"
          for field in PRIVS DOCKER GROUP KEY; do
            value="$(printf '%s\n' "$out" | sed -n "s/^${field}=//p" | tail -1)"
            lower="$(printf '%s' "$field" | tr 'A-Z' 'a-z')"
            echo "${lower}=${value:-не сообщено}" >> "$GITHUB_OUTPUT"
          done

      # Приёмка того, ради чего всё затевалось: вход уже не по паролю.
      # BatchMode=yes не даёт откатиться на пароль, поэтому успех здесь
      # означает именно рабочий ключ. known_hosts подготовлен шагом выше.
      - name: Проверить вход по ключу CI
        id: keycheck
        env:
          CI_KEY: ${{ secrets.VPS_DMC268_KEY_T1 }}
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          HOST: ${{ vars.VPS_DMC268_IP_T1 }}
        run: |
          set -uo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$CI_KEY" > "$key_file"

          rc=0
          out="$(ssh -i "$key_file" \
            -o BatchMode=yes -o ConnectTimeout=15 -o NumberOfPasswordPrompts=0 \
            "$SSH_USER@$HOST" "docker version --format '{{.Server.Version}}'" 2>&1)" || rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "result=ок, Docker $out" >> "$GITHUB_OUTPUT"
          else
            echo "result=отказ (код $rc): $out" >> "$GITHUB_OUTPUT"
          fi
          echo "Вход по ключу: код $rc, ответ: $out"

      - name: Записать результат в summary
        if: always()
        run: |
          {
            echo "## Подготовка сервера"
            echo
            echo "| Шаг | Результат |"
            echo "| --- | --- |"
            echo "| SSH | ${{ steps.bootstrap.outputs.ssh || 'не выполнялся' }} |"
            echo "| Права на сервере | ${{ steps.bootstrap.outputs.privs || 'не проверялись' }} |"
            echo "| Docker | ${{ steps.bootstrap.outputs.docker || 'не проверялся' }} |"
            echo "| Группа \`docker\` | ${{ steps.bootstrap.outputs.group || 'не проверялась' }} |"
            echo "| Публичный ключ CI | ${{ steps.bootstrap.outputs.key || 'не добавлялся' }} |"
            echo "| Вход по ключу CI | ${{ steps.keycheck.outputs.result || 'не проверялся' }} |"
            echo
            echo "Отсутствие прав — штатный исход: прогон зелёный, значит нужен человек с root."
          } >> "$GITHUB_STEP_SUMMARY"
