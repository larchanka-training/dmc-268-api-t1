name: LLM eval

# Eval правил ревью на живой модели (change add-rules-e2e-benchmark-and-load,
# design D5): корпус PR из tests/eval/rules/ проходит сквозной стенд в
# конфигурациях `.review/rules.md` absent, rules, empty, adversarial, отчёт с
# Precision/Recall - артефакт прогона и сводка job. Каждый прогон - платные
# вызовы EUrouter, поэтому запуск вручную. На PR - только когда меняется сам
# eval на модели (корпус, конфигурации, прогон) или этот workflow, и с одним
# повтором: новый workflow с одним workflow_dispatch нельзя запустить до мерджа
# в ветку по умолчанию, а изменённый корпус надо измерить до мерджа. Полный
# прогон с тремя повторами - вручную. PR из форка пропускаем: секрета в нём нет.
# Запросы синтетические: код проверяемых репозиториев наружу не уходит.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Повторов каждого кейса (разброс метрик между повторами - в отчёте)
        default: "3"
        required: true
      configs:
        description: Конфигурации правил через запятую
        default: absent,rules,empty,adversarial
        required: true
  pull_request:
    paths:
      - "tests/eval/rules/**"
      - ".github/workflows/eval.yml"

# У токена прогона только чтение: workflow ничего не пишет в репозиторий.
permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    # У PR из форка нет секретов: прогон без них закончился бы провалом «eval пропущен».
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # 7 кейсов × 4 конфигурации × до 2 вызовов модели на повтор; один повтор - около 2.5 мин.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dmc268
          POSTGRES_PASSWORD: dmc268
          POSTGRES_DB: dmc268
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268 -d dmc268"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dmc268:dmc268@localhost:5432/dmc268
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
      # Ключ и адрес выдала организация; GitHub маскирует секрет в логе.
      EUROROUTER_API_KEYS: ${{ secrets.AI_DMC268_T1 }}
      EUROROUTER_BASE_URL: ${{ vars.AI_DMC268_URL }}
      # Та же модель, что в llm-live.yml: метрики сравнимы только при одной модели.
      # Числа в docs/testing/RULES_E2E_REPORT.md сняты на qwen3-coder-30b-a3b, её
      # провайдер с 21.10 отвергает запросы (#93), поэтому здесь запасная (#95).
      EUROROUTER_MODEL: qwen3-coder-next-80b
      # Три прогона на кейс - из docs/testing/LLM_EVAL.md §5: один повтор разброса не покажет.
      # На PR хватает одного: он проверяет, что eval работает, а метрики снимают вручную.
      EVAL_REPETITIONS: ${{ inputs.repetitions || (github.event_name == 'pull_request' && '1') || '3' }}
      EVAL_CONFIGS: ${{ inputs.configs || 'absent,rules,empty,adversarial' }}
      EVAL_REPORT_DIR: eval-report
    steps:
      - uses: actions/checkout@v7
      # Точная версия: плавающих мажорных тегов у setup-uv нет.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - name: pytest -m eval (пропуск теста - провал)
        run: |
          set -o pipefail
          uv run pytest -q -rs -s -m eval tests/eval | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then
            echo "::error::eval пропущен: нет секрета AI_DMC268_T1, переменной AI_DMC268_URL или сервисов"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rules-eval-report
          path: eval-report/
          if-no-files-found: warn
