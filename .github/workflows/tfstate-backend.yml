# Проверка хранилища состояния в отрыве от деплоя: поднимает его, готовит
# бакет и убеждается, что tofu принимает бэкенд. Общие шаги живут в composite
# action и разделяются с deploy.yml.
# См. openspec/changes/tfstate-s3-backend/.
name: Terraform state backend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tfstate-backend.yml"
      - ".github/actions/s3-backend/action.yml"
      - ".github/scripts/render-s3-script.sh"
      - "infra/backend.tf"

permissions:
  contents: read

concurrency:
  group: tfstate-backend
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.5

      - uses: ./.github/actions/s3-backend
        id: backend
        with:
          ssh_key: ${{ secrets.VPS_DMC268_KEY_T1 }}
          ssh_user: ${{ secrets.VPS_DMC268_U }}
          host: ${{ vars.VPS_DMC268_IP_T1 }}
          s3_user: ${{ secrets.S3_USER_DMC268_T1 }}
          s3_password: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          container: dmc268-s3
          volume: dmc268-s3-data
          port: "9000"
          image: rustfs/rustfs:1.0.0
          cred_user_var: RUSTFS_ACCESS_KEY
          cred_pass_var: RUSTFS_SECRET_KEY
          bucket: dmc268-tfstate

      - name: Выяснить, поддерживает ли хранилище условную запись
        id: locking
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail
          endpoint="http://127.0.0.1:9000"
          probe="locking-probe-$(date +%s)"
          : > /tmp/empty

          # Нативная блокировка бэкенда s3 стоит на условной записи
          # (If-None-Match: *). Проверяем саму примитивную операцию: первая
          # запись должна пройти, вторая — упереться в PreconditionFailed.
          first=0
          aws --endpoint-url "$endpoint" s3api put-object --bucket dmc268-tfstate \
            --key "$probe" --body /tmp/empty --if-none-match '*' >/dev/null 2>&1 || first=$?

          if [ "$first" -ne 0 ]; then
            result="не проверено: клиент или хранилище не приняли --if-none-match"
          else
            second=0
            aws --endpoint-url "$endpoint" s3api put-object --bucket dmc268-tfstate \
              --key "$probe" --body /tmp/empty --if-none-match '*' >/dev/null 2>&1 || second=$?
            if [ "$second" -ne 0 ]; then
              result="поддерживается, нативная блокировка возможна"
            else
              result="НЕ поддерживается: повторная запись прошла, полагаемся на concurrency"
            fi
          fi
          echo "Условная запись: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          aws --endpoint-url "$endpoint" s3api delete-object --bucket dmc268-tfstate --key "$probe" >/dev/null 2>&1 || true

      - name: Проверить, что tofu принимает бэкенд
        id: tofu
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail
          rc=0
          out="$(tofu init -input=false -no-color 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "result=бэкенд принят" >> "$GITHUB_OUTPUT"
          else
            echo "result=tofu init не прошёл (код $rc)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Записать результат в summary
        if: always()
        run: |
          {
            echo "## Хранилище состояния Terraform"
            echo
            echo "| Шаг | Результат |"
            echo "| --- | --- |"
            echo "| Хранилище | ${{ steps.backend.outputs.storage || 'не поднималось' }} |"
            echo "| Бакет | ${{ steps.backend.outputs.bucket || 'не создавался' }} |"
            echo "| Версионирование | ${{ steps.backend.outputs.versioning || 'не проверялось' }} |"
            echo "| Условная запись | ${{ steps.locking.outputs.result || 'не проверялась' }} |"
            echo "| \`tofu init\` | ${{ steps.tofu.outputs.result || 'не выполнялся' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
