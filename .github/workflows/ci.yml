name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# У токена прогона только чтение: CI ничего не пишет в репозиторий.
permissions:
  contents: read

# Новый пуш в ветку пул-реквеста отменяет прогон по устаревшему коммиту.
# Пуши в main и develop не отменяются: там нужен результат по каждому коммиту.
# Одного cancel-in-progress: false для этого мало: при `queue: single` (по
# умолчанию) в группе ждёт только один прогон, и следующий пуш отменяет
# ожидающий — из трёх быстрых пушей средний CI не получил бы. `queue: max`
# держит в очереди до 100 прогонов, но с `cancel-in-progress: true` вместе
# запрещён, поэтому оба ключа — выражения от события: у pull_request — отмена
# и single, у push — очередь без отмены. Прогоны push одной ветки идут по
# одному, в порядке постановки в очередь; порядок GitHub не гарантирует, и
# gate в deploy.yml поэтому сверяет вершину develop.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

# Job'ы без `needs`: ни один не потребляет выход другого, а цепочка только
# удлиняла бы критический путь и прятала второй провал за первым. Синтаксис
# Python проверяет `ruff check` (ошибка разбора — тоже нарушение), отдельный
# compileall не нужен. Мимо ruff — только tests/fixtures/: это вход парсера
# AST, его разбирает tests/infrastructure/test_tree_sitter_extractor.py.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      # Sync в python-env идёт с --frozen — из uv.lock, не глядя в pyproject.toml:
      # зависимость, добавленная без `uv lock`, иначе прошла бы CI мимо
      # lock-файла. Порядок неважен: --frozen uv.lock не трогает.
      - run: uv lock --check
      - run: uv run ruff check .
      # Правило слоёв из BACKEND_ARCHITECTURE.md. Отдельным шагом: общий шаг
      # сообщил бы одну ошибку на две несвязанные проблемы.
      - run: uv run lint-imports
      - run: uv run mypy .
      # Контракт API — экспорт схемы из кода; устаревший docs/openapi/openapi.json — провал.
      - run: uv run python scripts/export_openapi.py --check

  # Ошибка в спеке иначе всплывает только при архиве change: требование без
  # сценария, MODIFIED, теряющий сценарии, ADDED уже существующего требования.
  # --strict ловит и слишком длинные требования. Версия openspec закреплена:
  # новые проверки приходят с её обновлением, а не сами по себе. uv npm-пакеты
  # не ставит, поэтому npx.
  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict
      # Change со всеми закрытыми задачами архивируется в том же PR — иначе его
      # дельты не доходят до openspec/specs/. Открытые change — в summary.
      # Явный `shell: bash` включает pipefail: сбой openspec не маскируется
      # ошибкой разбора JSON в скрипте.
      - run: npx --yes @fission-ai/openspec@1.15.0 list --json | python3 scripts/check_openspec_archived.py
        shell: bash

  # Статический аудит workflow и их скриптов: неприбитые actions и образы,
  # `${{ … }}` в `run`, опасные триггеры. Персона pedantic — ради
  # unpinned-images; падаем только на high. --offline: онлайн-аудитам нужен
  # токен к API, а результат не должен зависеть от сети. Версия закреплена:
  # новые проверки приходят с её обновлением.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Только uv, без Python проекта и sync: python-env здесь лишний. Версия uv —
      # та же, что в .github/actions/python-env.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uvx zizmor@1.31.1 --offline --persona pedantic --min-severity high .github/
      # Скрипты, которые вызывают workflow и actions (.github/scripts/**). shellcheck
      # предустановлен на ubuntu-latest (apt-пакет в образе раннера), отдельного
      # action не нужно. find отдаёт ненулевой код, если shellcheck упал.
      - run: find .github/scripts -name '*.sh' -exec shellcheck {} +

  # Dockerfile и собранный образ. hadolint — по правилам Dockerfile; trivy — по
  # образу целиком (пакеты ОС и зависимости из uv.lock). Падаем на HIGH и
  # CRITICAL, у которых есть исправление: --ignore-unfixed (ignore-unfixed в
  # action) не даёт красному CI из-за CVE, которую нечем закрыть, — такие
  # видны в отчёте trivy, но решения от нас не ждут. Образ собирается как в
  # деплое (context .), но не публикуется.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - run: docker build -t dmc268-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dmc268-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # Конфигурация стенда без стенда: формат, валидность и логика infra/*.tf и
  # проверок переменных (`tofu test`, infra/tests/). Провайдер docker в тестах
  # подменён mock_provider: ни docker.sock, ни сервера job не трогает.
  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive infra/
      - run: cd infra && tofu init -backend=false && tofu validate
      - run: cd infra && tofu test

  # Не после lint: замечание линтера не делает тесты бессмысленными, а в
  # цепочке оно прятало бы упавший тест до следующего пуша.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4.4-alpine@sha256:5b70d54d53d0ce9558b84ad93cb237d06fa2e8c57115fa0ff7223b9eaffa44ed
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dmc268:dmc268@localhost:5432/dmc268
      # Тесты читают эту переменную, а не DATABASE_URL. Префикс +psycopg
      # обязателен: с голым postgresql:// SQLAlchemy берёт psycopg2, которого
      # нет в зависимостях.
      TEST_DATABASE_URL: postgresql+psycopg://dmc268:dmc268@localhost:5432/dmc268
      # %2F is the default vhost "/" URL-encoded — pika parses a bare "//" as
      # an empty vhost, not "/" (see tests/queue, tests/worker).
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Postgres с pg_stat_statements в preload: канареечный тест пароля роли
      # (tests/db/test_pg_monitor_role_migration.py) требует загруженного
      # расширения, а service-контейнеры Actions не позволяют переопределить
      # CMD образа — поэтому база поднимается шагом docker run.
      - name: Postgres с pg_stat_statements
        run: |
          docker run -d --name ci-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=dmc268 -e POSTGRES_PASSWORD=dmc268 -e POSTGRES_DB=dmc268 \
            postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5 \
            -c shared_preload_libraries=pg_stat_statements
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U dmc268 -d dmc268 -q && break
            sleep 1
          done
          docker exec ci-postgres pg_isready -U dmc268 -d dmc268
      - uses: ./.github/actions/python-env
      - name: pytest (пропуск теста — провал)
        env:
          # Тест алярма брокера (tests/queue/test_broker_blocked.py) включает его
          # через `docker exec … rabbitmqctl` в service-контейнере. Контекст `job`
          # доступен только в env шага, не job'а.
          TEST_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
          # Пропуск роняет прогон — плагин tests/strict_skips.py.
          PYTEST_FAIL_ON_SKIP: "1"
        # Живые тесты против EUrouter (маркер live) - платные: `addopts` в
        # pyproject.toml их не собирает, их гоняет llm-live.yml с ключом.
        run: uv run pytest -q -rs
