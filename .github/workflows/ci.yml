name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - run: apk add --no-cache git nodejs python3 py3-pip
      - uses: actions/checkout@v4
      - run: pip3 install --break-system-packages -r requirements-dev.txt
      - run: python3 -m compileall -q -x '(^|/)(\.venv|venv|\.git)/' .

  lint:
    needs: syntax
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - run: apk add --no-cache git nodejs python3 py3-pip
      - uses: actions/checkout@v4
      - run: pip3 install --break-system-packages -r requirements-dev.txt
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - run: apk add --no-cache git nodejs python3 py3-pip
      - uses: actions/checkout@v4
      - run: pip3 install --break-system-packages -r requirements-dev.txt
      - run: pytest
