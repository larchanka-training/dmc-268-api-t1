name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# У токена прогона только чтение: CI ничего не пишет в репозиторий.
permissions:
  contents: read

# Новый пуш в ветку пул-реквеста отменяет прогон по устаревшему коммиту.
# Пуши в main и develop не отменяются: там нужен результат по каждому коммиту.
# Одного cancel-in-progress: false для этого мало: при `queue: single` (по
# умолчанию) в группе ждёт только один прогон, и следующий пуш отменяет
# ожидающий — из трёх быстрых пушей средний CI не получил бы. `queue: max`
# держит в очереди до 100 прогонов, но с `cancel-in-progress: true` вместе
# запрещён, поэтому оба ключа — выражения от события: у pull_request — отмена
# и single, у push — очередь без отмены. Прогоны push одной ветки идут по
# одному, в порядке постановки в очередь; порядок GitHub не гарантирует, и
# gate в deploy.yml поэтому сверяет вершину develop.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

# Job'ы без `needs`: ни один не потребляет выход другого, а цепочка только
# удлиняла бы критический путь и прятала второй провал за первым. Синтаксис
# Python проверяет `ruff check` (ошибка разбора — тоже нарушение), отдельный
# compileall не нужен. Мимо ruff — только tests/fixtures/: это вход парсера
# AST, его разбирает tests/infrastructure/test_tree_sitter_extractor.py.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      # Sync в python-env идёт с --frozen — из uv.lock, не глядя в pyproject.toml:
      # зависимость, добавленная без `uv lock`, иначе прошла бы CI мимо
      # lock-файла. Порядок неважен: --frozen uv.lock не трогает.
      - run: uv lock --check
      - run: uv run ruff check .
      # Правило слоёв из BACKEND_ARCHITECTURE.md. Отдельным шагом: общий шаг
      # сообщил бы одну ошибку на две несвязанные проблемы.
      - run: uv run lint-imports
      - run: uv run mypy .
      # Контракт API — экспорт схемы из кода; устаревший docs/openapi/openapi.json — провал.
      - run: uv run python scripts/export_openapi.py --check

  # Ошибка в спеке иначе всплывает только при архиве change: требование без
  # сценария, MODIFIED, теряющий сценарии, ADDED уже существующего требования.
  # --strict ловит и слишком длинные требования. Версия openspec закреплена:
  # новые проверки приходят с её обновлением, а не сами по себе. uv npm-пакеты
  # не ставит, поэтому npx.
  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict
      # Change со всеми закрытыми задачами архивируется в том же PR — иначе его
      # дельты не доходят до openspec/specs/. Открытые change — в summary.
      # Явный `shell: bash` включает pipefail: сбой openspec не маскируется
      # ошибкой разбора JSON в скрипте.
      - run: npx --yes @fission-ai/openspec@1.15.0 list --json | python3 scripts/check_openspec_archived.py
        shell: bash

  # Статический аудит workflow и их скриптов: неприбитые actions и образы,
  # `${{ … }}` в `run`, опасные триггеры. Персона pedantic — ради
  # unpinned-images; падаем только на high. --offline: онлайн-аудитам нужен
  # токен к API, а результат не должен зависеть от сети. Версия закреплена:
  # новые проверки приходят с её обновлением.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Только uv, без Python проекта и sync: python-env здесь лишний. Версия uv —
      # та же, что в .github/actions/python-env.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uvx zizmor@1.31.1 --offline --persona pedantic --min-severity high .github/
      # Скрипты, которые вызывают workflow и actions (.github/scripts/**). shellcheck
      # предустановлен на ubuntu-latest (apt-пакет в образе раннера), отдельного
      # action не нужно. find отдаёт ненулевой код, если shellcheck упал.
      - run: find .github/scripts -name '*.sh' -exec shellcheck {} +

  # Dockerfile и собранный образ. hadolint — по правилам Dockerfile; trivy — по
  # образу целиком (пакеты ОС и зависимости из uv.lock). Падаем на HIGH и
  # CRITICAL, у которых есть исправление: --ignore-unfixed (ignore-unfixed в
  # action) не даёт красному CI из-за CVE, которую нечем закрыть, — такие
  # видны в отчёте trivy, но решения от нас не ждут. Образ собирается как в
  # деплое (context .), но не публикуется.
  #
  # После gate — summary сборки в $GITHUB_STEP_SUMMARY: размер образа (сжатый
  # и распакованный), все находки hadolint и trivy — и те, что уронили gate, —
  # и разница с последним прогоном develop. Он виден и при упавшем gate: тогда
  # и нужен. Если образ не собрался или метрики не снялись, разделы сканеров
  # всё равно выводятся. Сжатый размер считается через docker save | gzip —
  # это десятки секунд на образ, второй запуск trivy берёт базу, скачанную
  # первым, так что 15 минут хватает с запасом.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - run: docker build -t dmc268-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dmc268-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Summary сборки (change ci-build-summary): ниже шаги ничего не роняют —
      # падает только gate выше, а summary нужен и тогда. continue-on-error —
      # на случай несобранного образа: trivy и collect на нём упадут сами.
      # Находки сканеров — вторым запуском с json, чтобы увидеть и то, что
      # gate пропускает (unfixed у trivy, style у hadolint).
      - name: Каталог summary
        if: ${{ !cancelled() }}
        run: mkdir -p build-summary
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          format: json
          output-file: build-summary/hadolint.json
          no-fail: true
      # cache: false — иначе actions/cache внутри action восстановит поверх
      # свежей базы первого запуска вчерашнюю копию по restore-keys, и trivy
      # снова скачает базу. База первого запуска лежит в том же cache-dir
      # (TRIVY_CACHE_DIR action ставит всегда). skip-setup-trivy — бинарь уже
      # в PATH от первого запуска; если тот не запускался, нет и образа.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          cache: false
          skip-setup-trivy: true
          image-ref: dmc268-api:ci
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: build-summary/trivy.json
      # Системный python3 раннера, без uv и sync: скрипт только на stdlib, а
      # окружение проекта ради него ставить незачем.
      - name: Метрики образа
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          python3 scripts/build_summary.py collect
          --image dmc268-api:ci
          --out build-summary/metrics.json
      # База для разницы — метрики последнего успешного прогона develop из
      # кэша Actions: токену не нужен actions: read, как скачиванию артефакта
      # чужого прогона. Кэш пул-реквеста видит кэш его базовой ветки.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          path: build-base
          key: build-metrics-${{ github.sha }}
          restore-keys: build-metrics-
      - name: Summary сборки
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          python3 scripts/build_summary.py render
          --metrics build-summary/metrics.json
          --base build-base/metrics.json
          --trivy build-summary/trivy.json
          --hadolint build-summary/hadolint.json
          >> "$GITHUB_STEP_SUMMARY"
      # Только успешный прогон develop становится базой. Ключ по sha: запись
      # кэша неизменяема, а restore-keys берёт самую свежую. Метрик нет (упал
      # collect) — базу не пишем: пустой кэш вытеснил бы рабочую базу.
      - name: Метрики develop для следующих прогонов
        id: base
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        continue-on-error: true
        run: |
          if [ -f build-summary/metrics.json ]; then
            mkdir -p build-base && cp build-summary/metrics.json build-base/metrics.json
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.base.outputs.saved == 'true' }}
        continue-on-error: true
        with:
          path: build-base
          key: build-metrics-${{ github.sha }}

  # Конфигурация стенда без стенда: формат, валидность и логика infra/*.tf и
  # проверок переменных (`tofu test`, infra/tests/). Провайдер docker в тестах
  # подменён mock_provider: ни docker.sock, ни сервера job не трогает.
  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive infra/
      - run: cd infra && tofu init -backend=false && tofu validate
      - run: cd infra && tofu test

  # Конфиги стека наблюдаемости (infra/observability/) валидируются самими
  # образами: опечатка в OTTL-стейтменте или секции конфига роняет эту джобу,
  # а не стенд при поднятии стека (#140). Docker-тест коллектора в pytest под
  # маркером и в CI не гоняется; у Loki есть -verify-config, у Tempo — свой
  # -config.verify («Verify configuration and exit», форма с =true: голый
  # флаг ждёт аргумент) — закрывает пробел из #140 без отдельной задачи.
  # Без needs — как остальные: провал валидации не делает бессмысленными
  # параллельные проверки.
  observability-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Единственный источник дайджестов — infra/locals.tf: литералы в workflow
      # разъезжались бы с ним при обновлении образа. awk печатает вторую
      # кавыченную часть строки `otelcol_image = "..."`. В $GITHUB_ENV, а не
      # через ${{ }} в run: выражения в run запрещены (ловит job zizmor).
      - name: Дайджесты образов из infra/locals.tf
        run: |
          {
            echo "OTELCOL=$(awk -F'"' '/^  otelcol_image/{print $2}' infra/locals.tf)"
            echo "LOKI=$(awk -F'"' '/^  loki_image/{print $2}' infra/locals.tf)"
            echo "PROM=$(awk -F'"' '/^  prometheus_image/{print $2}' infra/locals.tf)"
            echo "TEMPO=$(awk -F'"' '/^  tempo_image/{print $2}' infra/locals.tf)"
          } >> "$GITHUB_ENV"
      # Все ${env:...}, что читает otelcol.yaml, — только четыре POSTGRESQL_*:
      # validate подставляет их в конфиг и выходит, к базе не подключаясь,
      # поэтому значения фиктивные.
      - name: Коллектор телеметрии (otelcol validate)
        run: |
          docker run --rm \
            -e POSTGRESQL_USERNAME=dmc268_monitor \
            -e POSTGRESQL_PASSWORD=validate \
            -e POSTGRESQL_ENDPOINT=dmc268-postgres:5432 \
            -e POSTGRESQL_DATABASE=dmc268 \
            -v "$PWD/infra/observability/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            "$OTELCOL" validate --config=/etc/otelcol-contrib/config.yaml
      - name: Коллектор метрик контейнеров (otelcol validate)
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/otelcol-docker.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            "$OTELCOL" validate --config=/etc/otelcol-contrib/config.yaml
      - name: Коллектор логов контейнеров (otelcol validate)
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/otelcol-logs.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            "$OTELCOL" validate --config=/etc/otelcol-contrib/config.yaml
      - name: Prometheus (promtool check config)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            "$PROM" check config /etc/prometheus/prometheus.yml
      # -verify-config разбирает конфиг и выходит, не стартуя сервер.
      - name: Loki (-verify-config)
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/loki.yaml:/etc/loki/config.yaml:ro" \
            "$LOKI" -config.file=/etc/loki/config.yaml -verify-config
      # У Tempo флага -verify-config нет, но есть собственный -config.verify
      # («Verify configuration and exit»); форма с =true, голый флаг ждёт
      # аргумент. Закрывает пробел из #140 без отдельной задачи.
      - name: Tempo (-config.verify)
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/tempo.yaml:/etc/tempo/config.yaml:ro" \
            "$TEMPO" -config.file=/etc/tempo/config.yaml -config.verify=true

  # Не после lint: замечание линтера не делает тесты бессмысленными, а в
  # цепочке оно прятало бы упавший тест до следующего пуша.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4.4-alpine@sha256:5b70d54d53d0ce9558b84ad93cb237d06fa2e8c57115fa0ff7223b9eaffa44ed
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dmc268:dmc268@localhost:5432/dmc268
      # Тесты читают эту переменную, а не DATABASE_URL. Префикс +psycopg
      # обязателен: с голым postgresql:// SQLAlchemy берёт psycopg2, которого
      # нет в зависимостях.
      TEST_DATABASE_URL: postgresql+psycopg://dmc268:dmc268@localhost:5432/dmc268
      # %2F is the default vhost "/" URL-encoded — pika parses a bare "//" as
      # an empty vhost, not "/" (see tests/queue, tests/worker).
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Postgres с pg_stat_statements в preload: канареечный тест пароля роли
      # (tests/db/test_pg_monitor_role_migration.py) требует загруженного
      # расширения, а service-контейнеры Actions не позволяют переопределить
      # CMD образа — поэтому база поднимается шагом docker run.
      - name: Postgres с pg_stat_statements
        run: |
          docker run -d --name ci-postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=dmc268 -e POSTGRES_PASSWORD=dmc268 -e POSTGRES_DB=dmc268 \
            postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5 \
            -c shared_preload_libraries=pg_stat_statements
          # По TCP: временный сервер инициализации слушает только сокет и отвечал бы «готов» до перезапуска (#254).
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -h 127.0.0.1 -U dmc268 -d dmc268 -q && break
            sleep 1
          done
          docker exec ci-postgres pg_isready -h 127.0.0.1 -U dmc268 -d dmc268
      - uses: ./.github/actions/python-env
      - name: pytest (пропуск теста — провал)
        env:
          # Тест алярма брокера (tests/queue/test_broker_blocked.py) включает его
          # через `docker exec … rabbitmqctl` в service-контейнере. Контекст `job`
          # доступен только в env шага, не job'а.
          TEST_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
          # Пропуск роняет прогон — плагин tests/strict_skips.py.
          PYTEST_FAIL_ON_SKIP: "1"
        # Живые тесты против EUrouter (маркер live) - платные: `addopts` в
        # pyproject.toml их не собирает, их гоняет llm-live.yml с ключом.
        run: uv run pytest -q -rs

  # Chaos-сьют (#222): отказы модели, GitHub и смерть воркера посреди прогона на
  # сквозном стенде (tests/chaos/). Отдельным job'ом, а не в `test`: провал
  # отказоустойчивости виден своей галочкой, а основной прогон его не ждёт.
  # Основной `pytest` сьют не собирает (маркер `chaos` исключён в addopts);
  # `-m chaos` в командной строке перекрывает фильтр addopts. Сервисы - те же,
  # что у `test`: стенд ходит в настоящие PostgreSQL и RabbitMQ.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: dmc268
          POSTGRES_PASSWORD: dmc268
          POSTGRES_DB: dmc268
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268 -d dmc268"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.4-alpine@sha256:5b70d54d53d0ce9558b84ad93cb237d06fa2e8c57115fa0ff7223b9eaffa44ed
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dmc268:dmc268@localhost:5432/dmc268
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: chaos-сьют (пропуск теста — провал)
        env:
          PYTEST_FAIL_ON_SKIP: "1"
        run: uv run pytest -m chaos -q -rs tests/chaos
