name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.12"
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - run: uv run python -m compileall -q -x '(^|/)(\.venv|venv|\.git)/' .

  lint:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.12"
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run lint-imports

  terraform:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.5
      - run: tofu fmt -check -recursive infra/
      - run: cd infra && tofu init -backend=false && tofu validate

  test:
    needs: [lint, terraform]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dmc268
          POSTGRES_PASSWORD: dmc268
          POSTGRES_DB: dmc268
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268 -d dmc268"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dmc268:dmc268@localhost:5432/dmc268
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.12"
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - run: uv run pytest
