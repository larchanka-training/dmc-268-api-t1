name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# У токена прогона только чтение: CI ничего не пишет в репозиторий.
permissions:
  contents: read

# Новый пуш в ветку пул-реквеста отменяет прогон по устаревшему коммиту.
# Пуши в main и develop не отменяются: там нужен результат по каждому коммиту.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Точная версия: плавающих мажорных тегов у setup-uv нет.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - run: uv run python -m compileall -q -x '(^|/)(\.venv|venv|\.git)/' .

  lint:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Точная версия: плавающих мажорных тегов у setup-uv нет.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      # --frozen ставит из uv.lock не глядя в pyproject.toml: зависимость, добавленная
      # без `uv lock`, иначе прошла бы CI мимо lock-файла.
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      # Правило слоёв из BACKEND_ARCHITECTURE.md. Отдельным шагом: общий шаг
      # сообщил бы одну ошибку на две несвязанные проблемы.
      - run: uv run lint-imports
      - run: uv run mypy .
      # Контракт API — экспорт схемы из кода; устаревший docs/openapi/openapi.json — провал.
      - run: uv run python scripts/export_openapi.py --check

  # Ошибка в спеке иначе всплывает только при архиве change: требование без
  # сценария, MODIFIED, теряющий сценарии, ADDED уже существующего требования.
  # --strict ловит и слишком длинные требования. Версия openspec закреплена:
  # новые проверки приходят с её обновлением, а не сами по себе. uv npm-пакеты
  # не ставит, поэтому npx.
  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes @fission-ai/openspec@1.14.2 validate --all --strict
      # Change со всеми закрытыми задачами архивируется в том же PR — иначе его
      # дельты не доходят до openspec/specs/. Открытые change — в summary.
      # Явный `shell: bash` включает pipefail: сбой openspec не маскируется
      # ошибкой разбора JSON в скрипте.
      - run: npx --yes @fission-ai/openspec@1.14.2 list --json | python3 scripts/check_openspec_archived.py
        shell: bash

  # Статический аудит workflow: неприбитые actions и образы, `${{ … }}` в `run`,
  # опасные триггеры. Персона pedantic — ради unpinned-images; падаем только на
  # high. --offline: онлайн-аудитам нужен токен к API, а результат не должен
  # зависеть от сети. Версия закреплена: новые проверки приходят с её обновлением.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uvx zizmor@1.31.1 --offline --persona pedantic --min-severity high .github/

  # Dockerfile и собранный образ. hadolint — по правилам Dockerfile; trivy — по
  # образу целиком (пакеты ОС и зависимости из uv.lock). Падаем на HIGH и
  # CRITICAL, у которых есть исправление: --ignore-unfixed (ignore-unfixed в
  # action) не даёт красному CI из-за CVE, которую нечем закрыть, — такие
  # видны в отчёте trivy, но решения от нас не ждут. Образ собирается как в
  # деплое (context .), но не публикуется.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - run: docker build -t dmc268-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dmc268-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  terraform:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
      - run: tofu fmt -check -recursive infra/
      - run: cd infra && tofu init -backend=false && tofu validate

  test:
    # Не после terraform: `tofu validate` и `pytest` проверяют несвязанное, а в
    # цепочке загрузка провайдера с registry.opentofu.org решала бы, запустятся
    # ли тесты вообще.
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: dmc268
          POSTGRES_PASSWORD: dmc268
          POSTGRES_DB: dmc268
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268 -d dmc268"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.4-alpine@sha256:5b70d54d53d0ce9558b84ad93cb237d06fa2e8c57115fa0ff7223b9eaffa44ed
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dmc268:dmc268@localhost:5432/dmc268
      # Тесты читают эту переменную, а не DATABASE_URL. Префикс +psycopg
      # обязателен: с голым postgresql:// SQLAlchemy берёт psycopg2, которого
      # нет в зависимостях.
      TEST_DATABASE_URL: postgresql+psycopg://dmc268:dmc268@localhost:5432/dmc268
      # %2F is the default vhost "/" URL-encoded — pika parses a bare "//" as
      # an empty vhost, not "/" (see tests/queue, tests/worker).
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Точная версия: плавающих мажорных тегов у setup-uv нет.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      - run: uv sync --all-extras --frozen
      - name: pytest (пропуск теста — провал)
        env:
          # Тест алярма брокера (tests/queue/test_broker_blocked.py) включает его
          # через `docker exec … rabbitmqctl` в service-контейнере. Контекст `job`
          # доступен только в env шага, не job'а.
          TEST_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          set -o pipefail
          # Живые тесты против EUrouter (маркер live) - платные: `addopts` в
          # pyproject.toml их не собирает, их гоняет llm-live.yml с ключом.
          uv run pytest -q -rs | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then
            echo "::error::тест пропущен, и прогон доказывает меньше, чем кажется; обычно причина в TEST_DATABASE_URL"
            exit 1
          fi
