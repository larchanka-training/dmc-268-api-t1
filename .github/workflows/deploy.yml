# Деплой бэкенда на стенд. Катит только develop: сервер один, и два источника
# деплоя дрались бы за него (решение записано в #22).
# См. openspec/changes/deploy-api-stack/.
name: Deploy

# Деплой ждёт CI: workflow_run срабатывает, когда CI завершился. Работает
# только из ветки по умолчанию — у нас это develop.
# zizmor считает workflow_run опасным триггером: риск принят — gate катит только
# прогон CI по push и выкатывает проверенный head_sha, а не код из события.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

# packages: write нужен только job'у сборки — он и получает его у себя.
permissions:
  contents: read

# Второй деплой ждёт первый, а не отменяет его: отменённый `tofu apply`
# оставляет состояние заблокированным и стенд на полпути.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Какой коммит катить. Автоматический запуск — только после зелёного CI
  # по пушу в develop: прогон CI по пул-реквесту из ветки с именем develop
  # тоже попадает под фильтр branches, поэтому событие сверяется отдельно.
  # Ручной запуск — осознанное действие, CI он не ждёт, но только с develop:
  # с другой ветки не собирается и образ, а не только деплой.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Выбрать коммит
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # У workflow_run GITHUB_SHA — вершина ветки по умолчанию на момент
          # запуска, а не проверенный коммит; он лежит в head_sha.
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Прогоны CI по пушам в develop стоят в одной очереди (concurrency
          # в ci.yml, `queue: max`) и идут по одному, но порядок очереди GitHub
          # не гарантирует, а ручной запуск катит вершину develop мимо CI:
          # прогон CI старого коммита, завершившийся после него, откатил бы
          # стенд назад. Сверка с вершиной это закрывает; новый коммит катит
          # свой прогон.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/develop" --jq .sha)"
            if [ "$tip" != "$RUN_SHA" ]; then
              echo "::notice::${RUN_SHA} уже не вершина develop (${tip}), деплой пропущен"
              exit 0
            fi
          fi
          echo "sha=${RUN_SHA}" >> "$GITHUB_OUTPUT"

  image:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Наружу — ссылка с digest: тег перезаписывается, digest называет ровно
    # собранный здесь образ, и стенд запускает именно его (проверка api_image
    # в infra/variables.tf).
    outputs:
      image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Посчитать имя образа
        id: meta
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # Тег по commit sha, а не по хешу исходников: так видно, какой именно
          # коммит сейчас на стенде.
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):${SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"

      # Без этого шага buildx работает на docker-драйвере, а тот не умеет
      # экспортировать кеш: `cache-to: type=gha` падает с «Cache export is not
      # supported for the docker driver».
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Без provenance-аттестации: в ней данные прогона, и повторная сборка
          # того же коммита давала бы новый digest — tofu пересоздавал бы api и
          # worker с дренажом воркера. Аттестацию никто не читает.
          provenance: false

      - name: Убедиться, что образ забирается обратно
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Пустой digest дал бы ссылку, которую отвергнет проверка api_image,
          # но уже в job'е деплоя; ловим здесь.
          if [ -z "$DIGEST" ]; then
            echo "::error::сборка не вернула digest"
            exit 1
          fi
          docker manifest inspect "${IMAGE}@${DIGEST}" > /dev/null
          echo "образ доступен по digest ${DIGEST}"

      # trivy в ci.yml смотрит образ, собранный в CI, а на стенд уезжает этот:
      # он собран заново, и базовый python:3.14-slim между сборками мог
      # смениться. Поэтому сканируется опубликованный digest — ровно то, что
      # запустит стенд, — с теми же порогами, что в CI. Образ в приватном ghcr:
      # trivy берёт креды из ~/.docker/config.json, который записал
      # docker/login-action выше (keychain go-containerregistry в
      # pkg/remote/remote.go trivy). TRIVY_IMAGE_SRC=remote — сразу из реестра:
      # в локальном docker этого образа нет, buildx его не загружал.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  deploy:
    needs: [gate, image]
    runs-on: ubuntu-latest
    # С запасом на холодный tofu init и ожидание healthy API. Зависший
    # apply держит блокировку состояния, поэтому лучше упасть раньше шести часов.
    # Но не раньше, чем воркер доработает сообщение: при пересоздании apply ждёт
    # его до destroy_grace_seconds — до 41 мин (local.worker_stop_seconds в
    # infra/locals.tf); job, убитый посреди apply, оставил бы блокировку висеть.
    # Худший случай по шагам: targeted apply базы и брокера — до 1 мин штатной
    # остановки при пересоздании (destroy_grace_seconds 60) и ожидание healthy;
    # миграции; полный apply — до 41 мин грейса воркера и до 1,5 мин ожидания
    # healthy у API (wait_timeout 90); после apply — 10 с туннеля к API,
    # 1,5 мин воркера и до 5 мин реплики (первая сборка копирует базу целиком,
    # check-replica.sh). Итого ≈ 41 + 1 + 1,5 + 1,5 + 5 ≈ 50 мин плюс init и
    # миграции: запас в 60 есть, но растёт грейс воркера, wait_timeout API или
    # ожидание реплики — пересчитать здесь.
    timeout-minutes: 60
    # Environment `stand` пускает только develop: ручной запуск с другой ветки
    # отклоняется до первого шага. Секреты при этом остаются в репозитории.
    environment: stand
    # packages: read обязателен — образ тянется из приватного пакета: его
    # скачивает migrate.sh через docker login тем же GITHUB_TOKEN. Без него
    # реестр отвечает «denied», а не чем-нибудь понятным.
    permissions:
      contents: read
      packages: read
    # Адрес стенда: публичный origin интерфейса и адрес в summary. На сервер
    # шаги ходят через хост `stand` из ~/.ssh/config (stand-ssh).
    env:
      HOST: ${{ vars.VPS_DMC268_IP_T1 }}
    # Шаги с id — для summary: исход каждого берёт шаг summary, а каждый шаг с
    # `run` первой строкой ставит засечку (.github/scripts/deploy/mark.sh) —
    # по ним считается длительность. Так время шагов видно без `actions: read`
    # у токена: API прогона job'у не нужен.
    steps:
      # Засечка до checkout — скрипта ещё нет, поэтому строкой здесь, в том же
      # формате, что у mark.sh. От неё считается подготовка и весь job.
      - name: Засечь начало деплоя
        id: start
        run: mkdir -p "$RUNNER_TEMP/deploy-report" && echo "start $(date +%s.%N)" >> "$RUNNER_TEMP/deploy-report/marks"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      # Перезапуск упавшего деплоя («Re-run failed jobs») берёт sha из gate
      # первой попытки, а ручной запуск gate не сверяет: коммит, который уже
      # не вершина develop, не катится (check-tip.sh). Шаги ниже идут только
      # при deploy=true (`if: *fresh`); summary и шаги после упавших — по
      # своим условиям. Пропуск — зелёный job с пометкой в summary.
      - name: Сверить коммит с вершиной develop
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-tip.sh

      # Ключ, known_hosts и хост `stand` в ~/.ssh/config для всех шагов ниже.
      - uses: ./.github/actions/stand-ssh
        id: ssh
        if: &fresh steps.tip.outputs.deploy == 'true'
        with:
          ssh_key: ${{ secrets.VPS_DMC268_KEY_T1 }}
          ssh_user: ${{ secrets.VPS_DMC268_U }}
          host: ${{ vars.VPS_DMC268_IP_T1 }}

      # Без обёртки: она копирует stdout каждого вызова tofu в выходы шага, а
      # это `output -raw migrate_env` и `show -json` плана — пароли открытым
      # текстом. Коды возврата без неё те же.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        id: tofu
        if: *fresh
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      # Хранилище состояния и туннель к нему: снесённый контейнер чинится этим
      # же деплоем, новый тег образа выкатывается на прежнем томе.
      - uses: ./.github/actions/s3-backend
        id: s3
        if: *fresh
        with:
          s3_user: ${{ secrets.S3_USER_DMC268_T1 }}
          s3_password: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          container: dmc268-s3
          volume: dmc268-s3-data
          port: "9000"
          image: rustfs/rustfs:1.0.3
          cred_user_var: RUSTFS_ACCESS_KEY
          cred_pass_var: RUSTFS_SECRET_KEY
          bucket: dmc268-tfstate

      # docker CLI раннера ходит к демону стенда (DOCKER_HOST=ssh://stand) и
      # отдаёт ему учётные данные реестра вместе с запросом pull: образ лежит
      # в приватном пакете. Хватает packages: read у GITHUB_TOKEN этого job'а.
      # Сам вход идёт через docker раннера, не стенда: на сервере токен не
      # остаётся. Скачивает образ только migrate.sh: контейнеры api и worker
      # tofu создаёт из уже скачанного (infra/app.tf).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        id: login
        if: *fresh
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # До применения: считает логи контейнеров, которые выкат сейчас заменит.
      - name: Доставки вебхука и сбои воркера с прошлого выката
        id: diagnostics
        if: *fresh
        continue-on-error: true
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/diagnostics.sh

      # База и брокер — до миграций: на чистом сервере их ещё нет. На живом
      # стенде это `No changes` за несколько секунд; предупреждение OpenTofu о
      # -target здесь ожидаемое. postgres с `wait = true` (infra/postgres.tf):
      # apply возвращается, когда база отвечает. Заодно обновляется выход
      # migrate_env в состоянии — он зависит от этих контейнеров
      # (infra/locals.tf). Переменные — те же, что у полного apply (якорь).
      - name: Поднять базу и брокер
        id: infra
        if: *fresh
        working-directory: infra
        env: &tofu-env
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
          # Docker-провайдер зовёт системный ssh, и тот берёт пользователя,
          # адрес и ключ из ~/.ssh/config.
          TF_VAR_docker_host: ssh://stand
          # Наружу не смотрит ничего из этого стека: снаружи API доступен через
          # `/api/` на публичном входе интерфейса, который ходит к нему по
          # внутренней docker-сети. Порт остаётся на петле — от неё зависят
          # туннельная проверка живости и отладка. База и брокер портов на
          # хосте не публикуют вовсе: они только во внутренней сети стека.
          TF_VAR_bind_ip: 127.0.0.1
          # Интерфейс отдаётся по HTTPS на тот же адрес (public_tls в dmc-268-ui-t1),
          # и API приходят его запросы: с этим origin сверяется Origin.
          TF_VAR_public_origin: https://${{ vars.VPS_DMC268_IP_T1 }}
          TF_VAR_api_image: ${{ needs.image.outputs.image }}
          TF_VAR_postgres_password: ${{ secrets.PG_PASSWORD_DMC268_T1 }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD_DMC268_T1 }}
          # Пароль роли replicator. Нет секрета — пустая строка, и проверка
          # переменной роняет plan, ничего не меняя на сервере.
          TF_VAR_postgres_replication_password: ${{ secrets.PG_REPLICATION_PASSWORD_DMC268_T1 }}
          TF_VAR_github_webhook_secret: ${{ secrets.WEBHOOK_SECRET_DMC268_T1 }}
          TF_VAR_github_app_id: ${{ vars.APP_ID_DMC268_T1 }}
          TF_VAR_github_app_private_key: ${{ secrets.APP_PRIVATE_KEY_DMC268_T1 }}
          TF_VAR_github_app_client_id: ${{ vars.APP_CLIENT_ID_DMC268_T1 }}
          TF_VAR_github_app_client_secret: ${{ secrets.APP_CLIENT_SECRET_DMC268_T1 }}
          # Ключ шифрования токенов пользователя. Нет секрета — пустая строка, и
          # проверка переменной в infra/variables.tf роняет apply: стенд не
          # стартует без шифрования молча.
          TF_VAR_user_token_encryption_key: ${{ secrets.USER_TOKEN_KEY_DMC268_T1 }}
          # Модели на стенде пока нет: заглушка выбрана явно, ревью пустые.
          TF_VAR_llm_backend: stub
        run: |
          ../.github/scripts/deploy/mark.sh
          set -euo pipefail
          tofu init -input=false -no-color
          tofu apply -input=false -no-color -auto-approve -lock-timeout=2m \
            -target=docker_network.dmc268 \
            -target=docker_network.backend \
            -target=docker_container.postgres \
            -target=docker_container.rabbitmq

      # План полного выката — в файл, сразу после targeted apply: план видит
      # его результат, а миграции состояние не трогают (`tofu output` только
      # читает), так что `apply tfplan` после них не устаревает. Тома защищает
      # prevent_destroy (infra/postgres.tf) — и здесь, и в targeted apply выше;
      # сторож в plan.sh дублирует его для summary. Упал план — миграции не
      # идут. Переменные — те же (якорь).
      - name: Спланировать и проверить план
        id: plan
        if: *fresh
        env: *tofu-env
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/plan.sh

      # Миграции до выката нового кода: упали — полный apply не запускается,
      # на стенде остаётся прежняя версия API и воркера. Заодно скачивается
      # образ, из которого полный apply создаст api и worker.
      - name: Применить миграции
        id: migrate
        if: *fresh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
          API_IMAGE: ${{ needs.image.outputs.image }}
          DOCKER_HOST: ssh://stand
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/migrate.sh

      # Применяется ровно проверенный план. Apply ждёт, пока новый API станет
      # healthy (wait у docker_container.api), и падает через 90 с, если этого
      # не случилось. Заодно apply.sh собирает события контейнера API для
      # разбивки простоя в summary и удаляет файл плана.
      - name: Применить конфигурацию
        id: apply
        if: *fresh
        env: *tofu-env
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/apply.sh

      # Связь с хранилищем пропала посреди шага, который пишет состояние или
      # держит блокировку: несохранённое состояние осталось в
      # infra/errored.tfstate раннера, блокировка — в бакете, и следующий
      # деплой упёрся бы в неё, а после force-unlock — в старое состояние.
      # recover-state.sh заново открывает туннель, записывает состояние и
      # снимает свою блокировку; не вышло — `::error::` с инструкцией
      # (infra/README.md, «Если деплой упал посреди apply»). Ничего не
      # осталось (упал healthcheck, а не связь) — шаг ничего не меняет.
      - name: Восстановить состояние OpenTofu
        id: recover
        if: >-
          failure() && (steps.infra.outcome == 'failure' ||
          steps.plan.outcome == 'failure' || steps.apply.outcome == 'failure')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_USER_DMC268_T1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_PASSWORD_DMC268_T1 }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/recover-state.sh

      # От провайдера в логе только «container failed to be in healthy state»,
      # а проверки ниже после упавшего apply не идут: причину показывает этот шаг.
      - name: Логи API после упавшего apply
        id: api_logs
        if: failure() && steps.apply.outcome == 'failure'
        run: |
          .github/scripts/deploy/mark.sh
          ssh stand "docker logs --tail 50 dmc268-api 2>&1; docker inspect -f '{{json .State.Health}}' dmc268-api" || true

      - name: Проверить, что API жив (через туннель)
        id: check_api
        if: *fresh
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-api.sh

      - name: Проверить, что воркер работает
        id: check_worker
        if: *fresh
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-worker.sh

      - name: Проверить, что реплика получает поток
        id: check_replica
        if: *fresh
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/check-replica.sh

      # Уборка — гигиена, а не часть выката: неудача здесь означает мусор на
      # диске, а не сломанный стенд, поэтому шаг не роняет прогон. Стоит после
      # проверок: упавший выкат диск не трогает. Порог в неделю оставляет
      # предыдущие теги на месте для отката.
      #
      # Масштаб скромный: слои у тегов общие, и удаление двух образов API
      # освободило 99 КБ. По-настоящему место занимает смена зависимостей —
      # тогда на диск ложится новый набор слоёв, и убрать его больше некому.
      - name: Убрать устаревшие образы
        id: prune
        # После любого успешного apply, как раньше: упавшие проверки стенда
        # не повод оставлять старые образы на диске.
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        continue-on-error: true
        # Явный bash включает pipefail: сбой ssh не прячется за `tail`.
        shell: bash
        run: |
          .github/scripts/deploy/mark.sh
          ssh stand "docker image prune -af --filter until=168h" 2>&1 | tail -5

      # Исход, шаг падения, простой API, план, миграции, диск и длительность
      # шагов (summary.sh). Исходы шагов — списком, а не toJSON(steps): тот
      # несёт и выходы шагов, а env шага печатается в лог. Строка на каждый
      # шаг с id (сверяет tests/test_deploy_report.py).
      - name: Записать результат в summary
        id: summary
        if: always()
        # ssh внутри — под `timeout 30` (summary.sh); это — потолок шага на
        # случай, если повиснет что-то ещё: job ждал бы до своих 60 минут.
        timeout-minutes: 3
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ needs.gate.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          STEP_RESULTS: |
            start ${{ steps.start.outcome }} ${{ steps.start.conclusion }}
            checkout ${{ steps.checkout.outcome }} ${{ steps.checkout.conclusion }}
            tip ${{ steps.tip.outcome }} ${{ steps.tip.conclusion }}
            ssh ${{ steps.ssh.outcome }} ${{ steps.ssh.conclusion }}
            tofu ${{ steps.tofu.outcome }} ${{ steps.tofu.conclusion }}
            s3 ${{ steps.s3.outcome }} ${{ steps.s3.conclusion }}
            login ${{ steps.login.outcome }} ${{ steps.login.conclusion }}
            diagnostics ${{ steps.diagnostics.outcome }} ${{ steps.diagnostics.conclusion }}
            infra ${{ steps.infra.outcome }} ${{ steps.infra.conclusion }}
            plan ${{ steps.plan.outcome }} ${{ steps.plan.conclusion }}
            migrate ${{ steps.migrate.outcome }} ${{ steps.migrate.conclusion }}
            apply ${{ steps.apply.outcome }} ${{ steps.apply.conclusion }}
            recover ${{ steps.recover.outcome }} ${{ steps.recover.conclusion }}
            api_logs ${{ steps.api_logs.outcome }} ${{ steps.api_logs.conclusion }}
            check_api ${{ steps.check_api.outcome }} ${{ steps.check_api.conclusion }}
            check_worker ${{ steps.check_worker.outcome }} ${{ steps.check_worker.conclusion }}
            check_replica ${{ steps.check_replica.outcome }} ${{ steps.check_replica.conclusion }}
            prune ${{ steps.prune.outcome }} ${{ steps.prune.conclusion }}
        run: |
          .github/scripts/deploy/mark.sh
          .github/scripts/deploy/summary.sh
