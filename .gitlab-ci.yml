workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - syntax
  - lint
  - test

syntax:
  stage: syntax
  image: python:3.14
  script:
    - pip install -r requirements-dev.txt
    - python -m compileall -q -x '(^|/)(\.venv|venv|\.git)/' .

lint:
  stage: lint
  image: python:3.14
  script:
    - pip install -r requirements-dev.txt
    - ruff check .

test:
  stage: test
  image: python:3.14
  script:
    - pip install -r requirements-dev.txt
    - pytest
