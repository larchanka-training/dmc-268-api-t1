workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - syntax
  - lint
  - test

.uv:
  image: python:3.14
  before_script:
    - pip install --quiet uv
    - uv sync --all-extras --frozen

syntax:
  extends: .uv
  stage: syntax
  script:
    - uv run python -m compileall -q -x '(^|/)(\.venv|venv|\.git)/' .

lint:
  extends: .uv
  stage: lint
  script:
    - uv run ruff check .
    - uv run lint-imports

test:
  extends: .uv
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: dmc268
    POSTGRES_PASSWORD: dmc268
    POSTGRES_DB: dmc268
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://dmc268:dmc268@postgres:5432/dmc268
  script:
    - uv run pytest
