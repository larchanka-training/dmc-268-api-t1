[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Zero-padded so the migrations directory reads in order at a glance.
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is deliberately absent: env.py reads DATABASE_URL through
# Settings, so there is one place the connection string comes from.

[loggers]
keys = root,sqlalchemy,alembic

# Хендлеров и форматтеров нет: root-хендлер ставит
# app.infrastructure.logging.configure_logging (вызов из env.py). Свой
# console-хендлер дублировал бы каждую запись в stderr — `fileConfig` всё
# равно снимает все root-хендлеры перед установкой своих.
[handlers]
keys =

[formatters]
keys =

[logger_root]
level = INFO
handlers =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
