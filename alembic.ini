[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Zero-padded so the migrations directory reads in order at a glance.
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is deliberately absent: env.py reads DATABASE_URL through
# Settings, so there is one place the connection string comes from.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
