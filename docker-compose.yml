services:
  postgres:
    # Postgres with built-in pgvector: the repository profile (RAG) stores its
    # vectors in the same database; migration 0003 creates the extension.
    image: pgvector/pgvector:pg18
    # pg_stat_statements — для ручной диагностики медленных запросов:
    # библиотека должна быть загружена при старте сервера, расширение и роль
    # мониторинга создаёт миграция 0013. Receiver postgresql коллектора её не
    # читает (метрики базы он снимает обычными вьюхами статистики), но
    # накладные расходы preload ничтожны, поэтому локально preload держим
    # всегда — без переключателя. На стенде та же библиотека включается
    # вместе со стеком наблюдаемости (observability_enabled в infra/main.tf).
    # Та же команда — у контейнера postgres в infra/main.tf.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    # Алиас сети совпадает с именем контейнера на стенде (infra/main.tf):
    # одинаковые хосты в конфигах стека наблюдаемости — коллектор ходит по
    # dmc268-postgres и локально, и на стенде. Само имя контейнера не
    # фиксируется: fixed container_name сталкивался бы с infra на общем хосте
    # (второй compose-проект не смог бы создать контейнер с тем же именем).
    networks:
      default:
        aliases:
          - dmc268-postgres
    environment:
      POSTGRES_USER: dmc268
      POSTGRES_PASSWORD: dmc268
      POSTGRES_DB: dmc268
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18's image stores data under a major-version subdirectory of
      # this path; mounting at .../data (the pre-18 convention) makes the
      # entrypoint refuse to start against an empty, wrongly-shaped volume.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmc268 -d dmc268"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local infrastructure only: no application code talks to this yet. It is
  # provisioned ahead of the first caller (idempotency, rate limiting, or
  # cache) per docs/BACKEND_ARCHITECTURE.md's "no Redis now, Redis-ready by
  # construction". Adding a client, a port, or an adapter belongs to the
  # ticket that introduces that first caller, not this one.
  # Ни один сервис compose его не использует, поэтому по умолчанию не
  # поднимается: `docker compose --profile redis up -d redis`.
  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-alpine
    # Алиас сети совпадает с именем контейнера на стенде (infra/main.tf):
    # prometheus.yml скреит dmc268-rabbitmq в обоих окружениях. Имя контейнера
    # не фиксируется — см. комментарий у postgres.
    networks:
      default:
        aliases:
          - dmc268-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      # Метрики rabbitmq_prometheus (плагин включён в самом образе) —
      # наружу на петле для локальной проверки; в сети compose его скреит
      # Prometheus.
      - "127.0.0.1:15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовая миграция схемы: API и воркер стартуют только после её успешного
  # завершения, поэтому миграция идёт один раз, а не при каждом старте API.
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dmc268:dmc268@postgres:5432/dmc268
      # Settings требует все три обязательные настройки, даже когда нужна одна база.
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      GITHUB_WEBHOOK_SECRET: local-dev-secret
      # Пароль роли мониторинга dmc268_monitor: шаг роли едет вместе с
      # миграциями (замечание ревью PR #130 — «шаг теряется при переносе»),
      # роль создаёт ревизия 0013. Локальный дефолт пари́т реквизитам postgres
      # выше (как и POSTGRES_PASSWORD, допустим только локально); на стенде
      # переменную задаёт infra из секрета.
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-dmc268_monitor}
      # Телеметрия — тот же переключатель, что у api и воркера: с профилем
      # observability миграции пишут трейс деплоя (спека observability,
      # «Деплой с миграциями»). service.instance.id — по имени сервиса.
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4318}
      # Python SDK читает таймаут в СЕКУНДАХ, вопреки спеке OTel (мс).
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-4}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=${SERVICE_VERSION:-local},deployment.environment.name=local,service.instance.id=dmc268-migrate}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-database,http}
    depends_on:
      postgres:
        condition: service_healthy
    # Миграции и шаг роли — одним контейнером. ALTER ROLE идемпотентен, пароль
    # сводится с POSTGRES_MONITOR_PASSWORD на каждом запуске. Пароль —
    # параметром запроса psycopg (не литералом команды: тот светится в /proc и
    # docker logs), track_utility выключен той же транзакцией — иначе
    # ALTER ROLE ... PASSWORD лёг бы в pg_stat_statements открытым текстом.
    # Тот же шаг — у деплоя (.github/scripts/deploy/migrate.sh) и контейнера
    # миграций в infra.
    command:
      - sh
      - -c
      - |
        alembic upgrade head || exit 1
        python - <<'PY' || exit 1
        import os

        import psycopg

        # DATABASE_URL настроек — под схемой SQLAlchemy (postgresql+psycopg://);
        # psycopg ждёт стандартную схему postgresql://. Привязка значений — на
        # клиенте (ClientCursor): серверная не проходит по грамматике ALTER ROLE
        # (PASSWORD принимает только литерал, не $1), а литерал руками собирать
        # нельзя — psycopg экранирует сам.
        dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://", 1)
        with psycopg.connect(dsn, cursor_factory=psycopg.ClientCursor) as conn:
            with conn.transaction():
                conn.execute("SET LOCAL pg_stat_statements.track_utility = off")
                # Имя роли зашито — то же, что в миграции 0013 и env коллектора.
                conn.execute(
                    "ALTER ROLE dmc268_monitor PASSWORD %s",
                    (os.environ["POSTGRES_MONITOR_PASSWORD"],),
                )
        PY
    restart: "no"

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dmc268:dmc268@postgres:5432/dmc268
      # %2F — закодированный дефолтный vhost "/"; pika разбирает буквальный
      # "//" как пустой vhost, а не как "/" (см. tasks.md задачи 2.5).
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      # Только для локального docker-compose. Реальный секрет — в переменных
      # окружения деплоя, не в этом файле.
      GITHUB_WEBHOOK_SECRET: local-dev-secret
      # Реквизиты GitHub App — из окружения или .env: пустые значения
      # означают, что вебхуки отвечают 502 на обращении к VCS, остальное
      # API работает.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # OAuth того же GitHub App для входа и публичный origin интерфейса:
      # пустые — вход не работает, изменяющие запросы с сессией получают 403.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Ключ шифрования токенов пользователя (openssl rand -base64 32): пустой —
      # вход отказывает, токен открытым не хранится никогда.
      USER_TOKEN_ENCRYPTION_KEY: ${USER_TOKEN_ENCRYPTION_KEY:-}
      # Спаны OpenTelemetry по умолчанию никуда не уходят; console — в stdout.
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      # Логи — тот же переключатель, что у трейсов: none — остаются в stdout
      # (docker logs), otlp — уходят в коллектор.
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      # Метрики — тот же список экспортёров, что у трейсов (4.1).
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      # Экспорт включается окружением, без правки кода. С поднятым стеком
      # (профиль observability ниже) запускают так:
      #   OTEL_TRACES_EXPORTER=otlp OTEL_METRICS_EXPORTER=otlp \
      #   OTEL_LOGS_EXPORTER=otlp \
      #   docker compose --profile observability up -d
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4318}
      # Таймаут OTLP меньше окна graceful shutdown (5 с): выгрузка спанов при
      # остановке успевает даже при недоступном коллекторе (замечание из #89).
      # Python SDK читает переменную в СЕКУНДАХ, вопреки спеке OTel (мс).
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-4}
      # service.version — sha собранного образа: git внутрь контейнера не
      # попадает, поэтому переменная с дефолтом (осмысленно —
      # SERVICE_VERSION=$(git rev-parse --short HEAD) в .env).
      # service.instance.id — стабильное имя по сервису, а не UUID: случайный
      # идентификатор на процесс растил бы в Prometheus серии exported_instance
      # (ресурс коллектор конвертирует в лейблы).
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=${SERVICE_VERSION:-local},deployment.environment.name=local,service.instance.id=dmc268-api}
      # Стабильные имена атрибутов semconv для SQL и HTTP; то же значение ставит код.
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-database,http}
    # Драйвер логов json-file с той же ротацией, что в infra (local.log_opts);
    # без ротации лог растёт, пока не кончится диск. stdout остаётся для
    # docker logs, в Loki логи идут по OTLP (OTEL_LOGS_EXPORTER выше).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Худший случай остановки: 5 с graceful shutdown (рвутся потоки SSE) +
    # 4 с выгрузки спанов (OTEL_EXPORTER_OTLP_TIMEOUT) с запасом. Без него
    # дефолтные 10 с Docker — впритык, с ним lifespan гарантированно
    # завершается и спаны выгружаются (замечание из #89 про обе половины).
    stop_grace_period: 15s
    # Без sh: uvicorn — PID 1 и получает SIGTERM от `docker stop` сам, иначе
    # через грейс-период пришёл бы SIGKILL, и спаны не выгрузились.
    # --timeout-graceful-shutdown — по той же причине: открытый поток SSE иначе
    # держал бы остановку до конца прогона (подробно — в Dockerfile у CMD).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "5"]

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dmc268:dmc268@postgres:5432/dmc268
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      GITHUB_WEBHOOK_SECRET: local-dev-secret
      # Воркер сам достаёт дифф, правила и файлы через VCS-шлюз: без
      # реквизитов App каждый прогон завершится failed на fetch_diff.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Адаптер модели. stub - без похода к модели, ollama - локальная модель
      # (профиль ollama ниже, модель - OLLAMA_MODEL). Значения по умолчанию нет
      # намеренно: без LLM_BACKEND в .env воркер не стартует, а не публикует
      # пустые ревью. Eurorouter подключается только вторым и только флагом
      # LLM_HOSTED_FALLBACK=true: тогда код уходит hosted-провайдеру.
      LLM_BACKEND: ${LLM_BACKEND:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LLM_HOSTED_FALLBACK: ${LLM_HOSTED_FALLBACK:-false}
      EUROROUTER_BASE_URL: ${EUROROUTER_BASE_URL:-}
      EUROROUTER_MODEL: ${EUROROUTER_MODEL:-}
      EUROROUTER_API_KEYS: ${EUROROUTER_API_KEYS:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4318}
      # Python SDK читает таймаут в СЕКУНДАХ, вопреки спеке OTel (мс) —
      # подробнее у api.
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-4}
      # Тот же resource, что у api; дефолты те же (см. комментарий там), кроме
      # service.instance.id — стабильное имя воркера вместо случайного UUID.
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=${SERVICE_VERSION:-local},deployment.environment.name=local,service.instance.id=dmc268-worker}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-database,http}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    # Драйвер логов json-file с той же ротацией, что у api выше и в
    # infra/main.tf.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Как в infra: без init воркер — PID 1, а ему ядро не доставляет сигналы с
    # обработчиком по умолчанию, и второй SIGTERM не остановил бы его сразу.
    init: true
    # По SIGTERM воркер дорабатывает сообщение в работе. Худший случай — два
    # вызова модели (ревью и верификатор) × LLM_TIMEOUT_SECONDS (300) ×
    # LLM_MAX_ATTEMPTS (2) × два провайдера с LLM_HOSTED_FALLBACK = 2400 с,
    # плюс минута на GitHub и базу. Без этого через 10 с пришёл бы SIGKILL.
    # Та же формула — local.worker_stop_seconds в infra/locals.tf: меняется там —
    # меняем и здесь.
    # consumer_timeout брокера сюда не ограничение: в RabbitMQ 4.4 его
    # применяют только quorum-очереди, а очередь review — classic.
    stop_grace_period: 41m

  # Локальная модель для прогона на своей машине, только с профилем:
  #   docker compose --profile ollama up -d
  #   docker compose exec ollama ollama pull qwen2.5-coder:7b
  # и в .env: LLM_BACKEND=ollama, OLLAMA_MODEL=qwen2.5-coder:7b. Наружу порт не
  # публикуется: воркер ходит к ней по сети compose. На стенде Ollama
  # разворачивает отдельная задача.
  ollama:
    image: ollama/ollama:0.40.10
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama

  # Стек наблюдаемости — те же конфиги из infra/observability/, что и на
  # стенде (спека observability: различия окружений — переменные, не конфиги).
  # Восемь сервисов: коллектор (трейсы, логи, метрики приложения и базы), Loki
  # (логи), Tempo (трейсы), Prometheus (метрики), Grafana (интерфейс),
  # node-exporter (сервер), cAdvisor (контейнеры, через socket-proxy) и сам
  # socket-proxy (доступ cAdvisor к Docker API без docker.sock). Без профиля
  # ничего из этого не поднимается. Экспорт включают переменные api/worker —
  # см. комментарий у OTEL_TRACES_EXPORTER.
  #
  # Имена сервисов и алиасы сети совпадают с алиасами в infra/main.tf,
  # поэтому одни и те же конфиги резолвят хосты в обоих окружениях.
  # Образы зафиксированы дайджестами (имя@sha256:…) — это дайджест
  # манифест-листа (multi-arch), разрешённый docker buildx imagetools
  # inspect; тег в комментарии рядом. Одинаковый дайджест и в main.tf:
  # обновление образа — осознанная замена дайджеста в обоих местах с чтением
  # breaking changes.
  collector:
    # otel/opentelemetry-collector-contrib:0.158.0
    image: otel/opentelemetry-collector-contrib@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    profiles: ["observability"]
    networks:
      default:
        aliases:
          - collector
      observability:
    # Логи приложения приходят по OTLP из SDK (OTEL_LOGS_EXPORTER у api и
    # worker): файлы Docker коллектор не читает, и root ему не нужен.
    volumes:
      - ./infra/observability/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # Реквизиты роли мониторинга базы (receiver postgresql в otelcol.yaml):
      # локальные, как у api выше; на стенде — переменные infra из секрета.
      POSTGRESQL_USERNAME: dmc268_monitor
      POSTGRESQL_PASSWORD: dmc268_monitor
      POSTGRESQL_ENDPOINT: dmc268-postgres:5432
      POSTGRESQL_DATABASE: dmc268
    # Как у api: приём OTLP записи на диск не требует, поэтому файловая
    # система только для чтения, без capabilities, /tmp — tmpfs.
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - loki
      - tempo

  loki:
    # grafana/loki:3.7.9
    image: grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    profiles: ["observability"]
    networks:
      observability:
        aliases:
          - loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  tempo:
    # grafana/tempo:3.1.1
    image: grafana/tempo@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    profiles: ["observability"]
    networks:
      observability:
        aliases:
          - tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  prometheus:
    # prom/prometheus:v3.15.1
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["observability"]
    networks:
      default:
      observability:
        aliases:
          - prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Хранение метрик — 30 дней (как retention логов Loki).
      - --storage.tsdb.retention.time=30d
      # Потолок по размеру, а не только по времени: всплеск кардинальности
      # не должен забить диск раньше срока хранения. Свободное место видно
      # алертам (#100) по node_filesystem_avail_bytes от node-exporter.
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    # grafana/grafana:13.2.4
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: ["observability"]
    networks:
      observability:
        aliases:
          - grafana
    ports:
      # Единственная точка стека, нужная человеку: http://127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    environment:
      # Локально — без входа: аноним с правами Admin. На стенде учётка —
      # переменные infra: аноним выключен, пароль админа из секретов.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Телеметрия вендора off: статистика использования и проверка обновлений
      # не должны уходить с машины наружу. То же в main.tf и у Loki/Tempo в
      # их конфигах (loki.yaml, tempo.yaml).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  # Метрики сервера: CPU, память, диск, файловые системы хоста (алерты #100 —
  # свободное место). Каноничный запуск образа: корень хоста только для чтения
  # (--path.rootfs=/rootfs), /proc и /sys — источники статистики ядра.
  # На Docker Desktop «сервер» — это виртуальная машина: метрики хоста
  # ограничены ею, это ожидаемо.
  node-exporter:
    # quay.io/prometheus/node-exporter:v1.9.1
    image: quay.io/prometheus/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    profiles: ["observability"]
    networks:
      observability:
        aliases:
          - node-exporter
    command:
      - --path.rootfs=/rootfs
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # Прокси над Docker API (/var/run/docker.sock) с доступом по белому списку
  # эндпоинтов: cAdvisor — единственный клиент, docker.sock контейнерам больше
  # не монтируется. Права — минимальный работающий набор (проверено запуском
  # cAdvisor через proxy): CONTAINERS=1 — список, inspect и статистика
  # контейнеров; INFO=1 — /info и /version, без них cAdvisor падает на проверке
  # Docker-фабрики («403 Forbidden» на /v1.45/info) и не отдаёт метрики
  # контейнеров вовсе. События Docker (/events) не нужны: новые контейнеры
  # находятся опросом cgroup-иерархии. Сеть — отдельная (docker_proxy), в ней
  # только proxy и cAdvisor.
  dockerproxy:
    # tecnativa/docker-socket-proxy:v0.4.1
    image: tecnativa/docker-socket-proxy@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    profiles: ["observability"]
    environment:
      CONTAINERS: "1"
      INFO: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      docker_proxy:
        aliases:
          - dockerproxy

  # Метрики контейнеров: CPU и память каждого, включая сам стек. К Docker API
  # ходит только через socket-proxy (флаг -docker — проверено по --help образа
  # v0.52.1; ENV у образа флаги не читает): маунтов docker.sock и
  # /var/lib/docker больше нет. Маунты / и /sys — каноничные из документации
  # cAdvisor (только чтение): без них не видно cgroup-иерархии, по которой
  # находятся контейнеры, — проверено запуском. Без --privileged и /dev/kmsg
  # недоступны OOM- и perf-коллекторы, CPU, память, диски и сеть остаются.
  # Новые контейнеры cAdvisor находит сам, без подписки на события Docker:
  # опрашивает cgroup-иерархию и запрашивает у proxy inspect новых (проверено
  # запуском нового контейнера рядом). На Docker Desktop контейнеры живут в
  # ВМ — метрики хоста там не видны.
  cadvisor:
    # gcr.io/cadvisor/cadvisor:v0.52.1
    image: gcr.io/cadvisor/cadvisor@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435
    profiles: ["observability"]
    # Без root и без маунта «/» — как в infra (см. комментарий там): /rootfs
    # открывал бы unix-сокет Docker и Env всех контейнеров.
    user: "65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --docker=tcp://dockerproxy:2375
    volumes:
      - /sys:/sys:ro
    networks:
      observability:
        aliases:
          - cadvisor
      docker_proxy:

volumes:
  postgres_data:
    # Новое имя при переходе с postgres:18-alpine (musl) на pgvector (glibc):
    # текстовые индексы старого тома под другой сортировкой неконсистентны.
    name: dmc268-postgres-pgvector-data
  # Скачанные модели переживают пересоздание контейнера Ollama.
  ollama_models:
    name: dmc268-ollama-models
  # Данные стека наблюдаемости переживают пересоздание контейнеров.
  loki_data:
    name: dmc268-loki-data
  tempo_data:
    name: dmc268-tempo-data
  prometheus_data:
    name: dmc268-prometheus-data
  # Единственный том стека без фиксированного name: префикс compose-проекта
  # отделяет его от тома стенда (dmc268-grafana-data) на общем хосте — два
  # проекта с одним именем тома не поднимаются вместе. Внутри — только
  # локальное состояние Grafana (дашборды, собранные в UI): данные разработчиков
  # он не хранит, потери при пересоздании проекта не страшны.
  grafana_data:

# Сети стека наблюдаемости. docker_proxy — для доступа к Docker API через
# socket-proxy: в ней только dockerproxy и cAdvisor, internal — наружу в
# интернет им идти не нужно (публиковать там нечего). observability — весь
# стек, отдельно от default-сети приложения: из контейнеров интерфейса
# (подключаются к default) не должны быть доступны Loki без аутентификации,
# Prometheus, Tempo и приёмник OTLP (замечание ревью PR #130); internal не
# ставим — публикуемый порт Grafana на internal-сети не работает (проверено),
# изоляция достигается членством в сети. Коллектор двуподветочен: OTLP и
# скрейп postgres/rabbitmq — в default, экспортёры и цели Prometheus — в
# observability; Prometheus — тоже в обеих (скрейп rabbitmq). Имена не
# фиксируются, как и default: префикс compose-проекта отделяет их от сетей
# стенда.
networks:
  docker_proxy:
    internal: true
  observability:
