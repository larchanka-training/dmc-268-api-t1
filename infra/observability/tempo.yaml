# Трейсы — Tempo single-binary с локальным хранением (Tempo 3.x). Конфиг один
# для локального стека и стенда; различия окружений — переменные docker compose
# и infra, не разные конфиги.

server:
  http_listen_port: 3200

distributor:
  receivers:
    # Приём OTLP от коллектора (exporter otlp_http/tempo).
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Хранение трейсов — 14 дней: block_retention в дефолтах overrides
# (блока compactor в Tempo 3.x больше нет).
overrides:
  defaults:
    compaction:
      block_retention: 336h

usage_report:
  reporting_enabled: false
