# Метрики: Prometheus скрейпит exporter-порт коллектора (ручные метрики и
# HTTP-метрики FastAPI приходят туда через OTLP), RabbitMQ — плагин
# rabbitmq_prometheus (уже включён в образе rabbitmq:4.3-alpine) и
# postgres-exporter. Имена хостов совпадают локально и на стенде: в compose
# это имена сервисов и контейнеров, в infra — алиасы сети dmc268.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["collector:8889"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["dmc268-rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
