# Метрики: Prometheus скрейпит exporter-порт коллектора — туда через OTLP
# приходят ручные метрики, HTTP-метрики FastAPI и метрики базы (receiver
# postgresql коллектора, решение #89: отдельного экспортёра Postgres нет).
# RabbitMQ — плагин rabbitmq_prometheus (включён в образе
# rabbitmq:4.4-alpine), сервер — node-exporter, контейнеры — receiver
# docker_stats отдельного экземпляра коллектора (job docker-stats). Имена
# хостов совпадают локально и на стенде: в compose это имена сервисов и
# алиасы сети, в infra — алиасы сети dmc268.
global:
  scrape_interval: 15s

# Критические алерты (#100): правила — alerts.yml (тесты — alerts.test.yml),
# доставка в Telegram — Alertmanager (alertmanager.yml). Путь правил один и
# тот же: compose монтирует файл, infra заливает upload-ом.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: collector
    # honor_labels обязателен: exporter-порт коллектора отдаёт ряды с лейблом
    # job = service.name (resource_to_telemetry_conversion в otelcol.yaml).
    # Без honor_labels Prometheus перезаписал бы job именем скрейп-джобы
    # ("collector"), а имя сервиса уехал бы в exported_job — панели дашборда,
    # которые фильтруют по job, остались бы пустыми.
    honor_labels: true
    static_configs:
      - targets: ["collector:8889"]

  # Метрики контейнеров: otelcol-docker.yaml. Панели фильтруют по container_name.
  - job_name: docker-stats
    static_configs:
      - targets: ["collector-docker:8889"]

  # Свои метрики экземпляров коллектора (otelcol_*), Loki и Tempo: отказы
  # приёма, сбои экспорта, объём.
  - job_name: collector-self
    static_configs:
      - targets: ["collector:8888"]

  - job_name: collector-docker-self
    static_configs:
      - targets: ["collector-docker:8888"]

  - job_name: collector-logs-self
    static_configs:
      - targets: ["collector-logs:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: rabbitmq
    # per-object, а не агрегированный /metrics: панель очереди строится по
    # лейблу queue (rabbitmq_queue_messages{queue="review_jobs.qq"}), потребители
    # и сообщения в работе — rabbitmq_queue_consumers и _messages_unacked; агрегат
    # лейблы теряет. Очередей у сервиса единицы — per-object дорогого
    # не стоит.
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["dmc268-rabbitmq:15692"]

  # Метрики сервера: CPU, память, диски и файловые системы (алерты #100 —
  # свободное место, включая потолок Prometheus по размеру).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Пробы сервисов через blackbox-exporter (blackbox.yml): то же, что видит
  # healthcheck Docker, — у receiver docker_stats коллектора 0.158 статуса
  # здоровья контейнера нет (container.state.health.status появился в 0.160).
  # Модуль — у каждой цели в __param_module; цель уходит параметром target,
  # а в instance остаётся её адрес. Метка service — в алертах и в
  # подавлении производных (alertmanager.yml). Имена хостов — алиасы сети,
  # одинаковые в compose и на стенде; реплики локально нет, её проба там
  # падает всегда.
  - job_name: blackbox-services
    metrics_path: /probe
    static_configs:
      - targets: ["http://dmc268-api:8000/health"]
        labels: {service: api, __param_module: http_health}
      - targets: ["dmc268-postgres:5432"]
        labels: {service: postgres, __param_module: tcp_connect}
      - targets: ["dmc268-postgres-replica:5432"]
        labels: {service: postgres-replica, __param_module: tcp_connect}
      - targets: ["dmc268-rabbitmq:5672"]
        labels: {service: rabbitmq, __param_module: tcp_connect}
    relabel_configs: &blackbox-relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Публичный вход по HTTPS и срок его сертификата. Адрес у стенда свой, а
  # локально публичного входа нет, поэтому цель — в файле: на стенде его
  # рендерит infra/observability.tf из public_origin, локально compose
  # монтирует public-targets.yml с пустым списком.
  - job_name: blackbox-public
    metrics_path: /probe
    params:
      module: [https_public]
    file_sd_configs:
      - files: [/etc/prometheus/targets/public.yml]
    relabel_configs: *blackbox-relabel
