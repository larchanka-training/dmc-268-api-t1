# Коллектор телеметрии — один конфиг для локального стека (docker compose,
# профиль observability) и стенда (infra/main.tf): различия окружений — только
# переменные запуска (пути лог-файлов, реквизиты receiver postgresql) и сетевые
# алиасы, совпадающие в обоих окружениях. Образ зафиксирован дайджестом в
# docker-compose.yml и main.tf (тег в комментарии рядом): у приёмника file_log
# операторы stanza вне гарантий стабильности (beta), при обновлении образа
# читаются breaking changes.

receivers:
  # Приём OTLP от сервисов приложения: трейсы и метрики SDK при
  # OTEL_TRACES_EXPORTER=otlp / OTEL_METRICS_EXPORTER=otlp.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Логи сервисов из stdout: драйвер json-file пишет их в конверт
  # {"log": "...", "time": "..."}, внутри конверта — JSON-запись из
  # app/infrastructure/logging.py. Пути вынесены в переменную
  # OTELCOL_LOG_FILES: id контейнеров различаются между окружениями.
  file_log:
    include:
      - ${env:OTELCOL_LOG_FILES}
    start_at: end
    storage: file_storage
    operators:
      # Конверт Docker: время записи — из него. Docker пишет RFC3339Nano;
      # layout — go-time шаблон того же формата.
      - type: json_parser
        id: docker
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      # Внутренний JSON записи становится телом — его разбирает следующий
      # parser; окончательное тело запись получает ниже (message-to-body).
      - type: move
        from: attributes.log
        to: body
      # Поля записи по модели OTel. Имена полей — те, что stanza ждёт по
      # умолчанию, и они совпадают с полями record_to_fields:
      # attributes.trace_id / attributes.span_id / attributes.trace_flags и
      # attributes.severity. Не-JSON строки (логи самих контейнеров стека)
      # в Loki не идут.
      - type: json_parser
        id: app-json
        on_error: drop
        trace:
          trace_id:
            parse_from: attributes.trace_id
          span_id:
            parse_from: attributes.span_id
          trace_flags:
            parse_from: attributes.trace_flags
        severity:
          parse_from: attributes.severity
      # Тело записи — текст сообщения: поля записи уже лежат в атрибутах, и
      # строка-JSON в теле хранила бы весь текст в Loki дважды. move удаляет
      # источник: отдельный оператор remove для attributes.message здесь был
      # бы мёртвым — он гарантированно промахивался бы и с on_error: send
      # писал «field does not exist» в лог коллектора на каждой записи.
      - type: move
        id: message-to-body
        from: attributes.message
        to: body
      # color_message — ANSI-дубль сообщения uvicorn — удаляется не здесь, а
      # стейтментом delete_key в transform/redact-logs: у оператора remove
      # этой версии stanza нет тихого пропуска отсутствующего поля (значения
      # continue нет — «all processing errors will be logged»), и каждая
      # запись без color_message давала бы ошибку в лог коллектора.

  # Метрики базы (решение #89): снимает сам коллектор receiver-ом postgresql —
  # без отдельного контейнера экспортёра, в общий конвейер метрик. Роль
  # только-чтение dmc268_monitor с привилегией pg_monitor создаёт миграция
  # 0013; её реквизиты приходят переменными окружения — они различаются между
  # локальным стеком и стендом, литералом в общем конфиге им не место.
  # Endpoint — строго host:port, имя базы передаётся отдельно (databases):
  # суффикс /dbname endpoint этого receiver не принимает. Тяжёлые запросы —
  # из pg_stat_statements: shared_preload_libraries задаёт сама база (command
  # у контейнера postgres), расширение создаёт та же миграция 0013.
  postgresql:
    username: ${env:POSTGRESQL_USERNAME}
    password: ${env:POSTGRESQL_PASSWORD}
    endpoint: ${env:POSTGRESQL_ENDPOINT}
    databases: ["${env:POSTGRESQL_DATABASE}"]
    # База в нашей docker-сети и локально, и на стенде: TLS между коллектором
    # и Postgres не поднимается ни в одном окружении — без этого receiver
    # падает с «SSL is not enabled on the server».
    tls:
      insecure: true
    collection_interval: 15s

processors:
  # Потолок памяти коллектора; в infra контейнеру задан лимит с запасом
  # (observability_memory_mb.collector).
  memory_limiter:
    check_interval: 1s
    spike_limit_mib: 64
    limit_mib: 256
  batch:
    timeout: 5s

  # service.name из полей записи — в ресурс OTLP-лога: Loki берёт имя сервиса
  # из ресурса (label service_name), иначе все записи идут как unknown_service.
  groupbyattrs/service:
    keys:
      - service.name

  # Фильтр чужих контейнеров. Коллектор работает под root и читает
  # *-json.log всех контейнеров хоста — иначе лог-файлы Docker не прочитать
  # (root оставлен намеренно), поэтому чужие JSON-логи отсекаются здесь:
  # в Loki идут записи только трёх наших сервисов. У записей file_log
  # service.name — атрибут записи (до groupbyattrs/service), у OTLP-логов —
  # ресурс: условие покрывает оба случая, а имя, которого нет нигде,
  # не совпадает ни с одним равенством — тоже дроп. Условие log_record —
  # правило дропа: запись с несовпавшим условием уходит в Loki.
  filter/foreign-services:
    error_mode: ignore
    logs:
      log_record:
        - 'not (attributes["service.name"] == "dmc-268-api" or attributes["service.name"] == "dmc-268-worker" or attributes["service.name"] == "dmc-268-migrate" or resource.attributes["service.name"] == "dmc-268-api" or resource.attributes["service.name"] == "dmc-268-worker" or resource.attributes["service.name"] == "dmc-268-migrate")'

  # Редакция логов — тот же второй рубеж после SDK, что transform/redact для
  # трейсов (первый — фильтры app/api/log_redaction.py). Стектрейс и сообщение
  # исключения несут значения ключей базы и текст ответа провайдера модели —
  # те же поля semconv, что у событий exception в трейсах. Тело гасится у
  # записей, несущих исключение: текст исключения мог попасть в сообщение
  # библиотечного логгера, а правило событий exception в трейсах действует
  # по тому же принципу — по наличию исключения, не по его типу.
  transform/redact-logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["exception.stacktrace"], "<скрыто>") where attributes["exception.stacktrace"] != nil
          - set(attributes["exception.message"], "<скрыто>") where attributes["exception.message"] != nil
          # Тело записи — текст сообщения (оператор message-to-body выше).
          - set(body, "<скрыто>") where attributes["exception.stacktrace"] != nil
          # ANSI-дубль сообщения uvicorn удаляется целиком; message уже в теле
          # (оператор message-to-body). delete_key молча пропускает отсутствие
          # ключа — по документации OTTL это no-op для несуществующего, поэтому
          # записи без color_message не дают ни ошибок, ни шума (remove из
          # stanza так не умеет — см. комментарий у message-to-body).
          - delete_key(attributes, "color_message")

  # Редакция чувствительных данных — второй рубеж после SDK (первый — фильтры
  # app/api/log_redaction.py и статус по имени типа в
  # app/infrastructure/telemetry.py). Значение заменяется маркером <скрыто>,
  # атрибут остаётся на месте: наличие атрибута и тип исключения сохраняются —
  # диагноз в трейсе остаётся, секреты нет. Примеры из аудита #89 накрывает
  # тест tests/infrastructure/test_collector_redaction.py.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # query и полный URL httpx-спанов: имя приватного репозитория,
          # пути файлов и токены в них.
          - set(attributes["url.query"], "<скрыто>") where attributes["url.query"] != nil
          - set(attributes["url.full"], "<скрыто>") where attributes["url.full"] != nil
          # Значения db.*: SQL-текст, имя базы и пользователя — psycopg кладёт
          # значения ключей в тексты ошибок. Имена старых semconv оставлены на
          # случай инструментария, который их ещё пишет.
          - set(attributes["db.system"], "<скрыто>") where attributes["db.system"] != nil
          - set(attributes["db.name"], "<скрыто>") where attributes["db.name"] != nil
          - set(attributes["db.statement"], "<скрыто>") where attributes["db.statement"] != nil
          - set(attributes["db.operation"], "<скрыто>") where attributes["db.operation"] != nil
          - set(attributes["db.user"], "<скрыто>") where attributes["db.user"] != nil
          - set(attributes["db.sql.table"], "<скрыто>") where attributes["db.sql.table"] != nil
          - set(attributes["db.system.name"], "<скрыто>") where attributes["db.system.name"] != nil
          - set(attributes["db.namespace"], "<скрыто>") where attributes["db.namespace"] != nil
          - set(attributes["db.query.text"], "<скрыто>") where attributes["db.query.text"] != nil
          - set(attributes["db.operation.name"], "<скрыто>") where attributes["db.operation.name"] != nil
          # Описание статуса SQL-спанов: в DETAIL psycopg — значения ключей.
          # Только заполненное описание: у успешных SQL-спанов статус Unset и
          # описание пустое — бессмысленный маркер им не ставится. Сравнение
          # с пустой строкой, а не с nil: геттер status.message возвращает
          # Go-строку (для Unset — ""), и nil-сравнение по правилам OTTL
          # (string против nil — «not equal») было бы всегда истинным.
          # Описания статусов прочих спанов не трогаются: после #122 это имя
          # типа исключения, диагноз в трейсе остаётся.
          - set(status.message, "<скрыто>") where (attributes["db.system.name"] != nil or attributes["db.system"] != nil) and status.message != ""
      # message и stacktrace события exception: там текст ответа провайдера
      # модели и значения ключей из ошибок базы. exception.type сохраняется.
      - context: spanevent
        statements:
          - set(attributes["exception.message"], "<скрыто>") where name == "exception"
          - set(attributes["exception.stacktrace"], "<скрыто>") where name == "exception"

exporters:
  # Трейсы — в Tempo по OTLP/HTTP.
  otlphttp/tempo:
    endpoint: http://tempo:4318
  # Логи — в Loki: нативный приём OTLP.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # Метрики — exporter-порт коллектора: Prometheus скрейпит его (job collector).
  # resource_to_telemetry_conversion переносит атрибуты ресурса (service.name)
  # в лейблы рядов: без неё job у всех рядов — "collector" (имя скрейп-джобы),
  # а имя сервиса прячется в exported_job — ряды сервисов не различить ни в
  # запросах, ни в алертах.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  # Смещения file_log между рестартами: без них после перезапуска коллектора
  # старые записи уходили бы в Loki повторно.
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [file_storage, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp, postgresql]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp, file_log]
      processors: [memory_limiter, filter/foreign-services, transform/redact-logs, groupbyattrs/service, batch]
      exporters: [otlphttp/loki]
