# Критические алерты стенда (#100). Правила читает Prometheus (rule_files в
# prometheus.yml), доставку в Telegram делает Alertmanager (alertmanager.yml).
# Пороги и что делать по каждому алерту — infra/README.md, «Алерты»; поведение
# правил закрепляют тесты promtool в alerts.test.yml (job observability-configs
# в CI). Файл один и тот же локально и на стенде: локально часть алертов горит
# всегда — там нет реплики, копий и интерфейса, — и это ожидаемо.
#
# Метки: severity — critical (доставляется сразу) или warning (то же, но
# повтор реже, см. alertmanager.yml); service — к какому сервису относится
# алерт: критический алерт глушит предупреждения того же service. Критические
# не глушатся: у ContainerDown и ContainerRestarting метки service нет, и при
# остановке воркера придут и ContainerDown, и WorkerNotConsuming.

groups:
  # Месячный бюджет токенов модели — константа, а не переменная окружения:
  # конфиги стека одинаковы локально и на стенде. Смена бюджета — правка этой
  # строки и README.
  - name: dmc268-budget
    rules:
      - record: dmc268:llm_tokens_budget_month
        expr: vector(50000000)
      # Бюджет расхода модели в евро (#119): 20 € в месяц.
      - record: dmc268:llm_cost_budget_eur_month
        expr: vector(20)

  - name: dmc268-services
    rules:
      # Контейнер не запущен: receiver docker_stats видит только запущенные,
      # поэтому остановленный, удалённый или так и не созданный контейнер — это
      # пропавший ряд. absent() по каждому имени отдельно: так в алерте есть
      # метка container_name. Список — сервисы, без которых стенд не работает
      # или теряет данные, и основной коллектор: без него молчат метрики
      # приложения, а значит, и часть алертов. Рядов нет ни у кого — значит,
      # не работает сам сбор (лёг экземпляр docker_stats или socket-proxy):
      # тогда горит ScrapeTargetDown или ContainerMetricsMissing, а не восемь
      # ContainerDown разом.
      #
      # Воркеров может быть несколько (#99), и сколько их, правило не знает:
      # ожидаемые экземпляры — ряды dmc268:worker_expected из workers.yml (на
      # стенде он собран из worker_replicas), и горит каждый без ряда метрик
      # контейнера. group by оставляет одну метку container_name, как у
      # absent(): первый воркер из обеих ветвей — один алерт. absent() по
      # dmc268-worker остаётся на случай, если workers.yml не прочитался:
      # первый экземпляр есть при любом worker_replicas.
      - alert: ContainerDown
        expr: |
          (
            absent(container_uptime_seconds{container_name="dmc268-api"})
            or absent(container_uptime_seconds{container_name="dmc268-worker"})
            or (group by (container_name) (dmc268:worker_expected) unless on(container_name) container_uptime_seconds)
            or absent(container_uptime_seconds{container_name="dmc268-postgres"})
            or absent(container_uptime_seconds{container_name="dmc268-postgres-replica"})
            or absent(container_uptime_seconds{container_name="dmc268-postgres-backup"})
            or absent(container_uptime_seconds{container_name="dmc268-rabbitmq"})
            or absent(container_uptime_seconds{container_name="dmc268-ui"})
            or absent(container_uptime_seconds{container_name="dmc268-otelcol"})
          )
          and on() (count(container_uptime_seconds) > 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Контейнер {{ $labels.container_name }} не запущен"
          description: "Ряда container_uptime_seconds нет 2 минуты: контейнер остановлен, удалён или не создан. Проверка: docker ps -a --filter name={{ $labels.container_name }}"

      # Метрик контейнеров нет ни у кого при живом скрейпе: docker_stats не
      # читает Docker API (лёг dmc268-docker-proxy) — ContainerDown и
      # ContainerRestarting при этом слепы.
      #
      # Здесь и в WorkerNotConsuming, LlmBudgetUnknown, ReplicaNotStreaming
      # absent() глушится, только когда цель не отвечала все 5 минут — тогда
      # горит ScrapeTargetDown. По одному up == 0 любой пропущенный скрейп
      # сбрасывал бы for, и алерт мог не загореться никогда (ревью PR #324).
      - alert: ContainerMetricsMissing
        expr: absent(container_uptime_seconds) unless on() (max_over_time(up{job="docker-stats"}[5m]) == 0)
        for: 5m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: "Нет метрик контейнеров"
          description: "5 минут нет ни одного ряда container_uptime_seconds, хотя collector-docker отвечает: receiver docker_stats не читает Docker API. Проверьте dmc268-docker-proxy и логи dmc268-otelcol-docker."

      # Перезапуск: restart = unless-stopped поднимает упавший процесс, и без
      # алерта цикл падений выглядит «живым» контейнером.
      - alert: ContainerRestarting
        expr: increase(container_restarts_total{container_name=~"dmc268-.+"}[15m]) >= 2
        labels:
          severity: critical
        annotations:
          summary: "Контейнер {{ $labels.container_name }} перезапускается"
          description: "{{ $value | printf \"%.0f\" }} перезапусков за 15 минут. Причина — в docker logs {{ $labels.container_name }} и в Loki."

      # Память у потолка: до OOM, а не после него, как ContainerRestarting.
      # usage_total считается без кэша страниц: его ядро вытеснит раньше OOM.
      # Контейнеру без потолка Docker отдаёт лимит, равный памяти хоста, и
      # исключать его не нужно: 90 % памяти хоста тоже беда. Лимит 0 отброшен,
      # чтобы не делить на ноль. warning: сбоя ещё нет, а OOM сам даст critical
      # ContainerRestarting. service берётся из имени без dmc268-, как у
      # ServiceProbeFailed: без этой метки предупреждение глушил бы любой
      # критический алерт без service, например ContainerDown чужого контейнера.
      # Номер экземпляра отбрасывается (#99): у dmc268-worker-2 service тот же
      # worker, и его предупреждение глушат критические алерты воркера.
      - alert: ContainerMemoryNearLimit
        expr: |
          label_replace(
            container_memory_usage_total_bytes{container_name=~"dmc268-.+"}
            / (container_memory_usage_limit_bytes > 0),
            "service", "$1", "container_name", "dmc268-(.+?)(?:-[0-9]+)?"
          ) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер {{ $labels.container_name }} занял {{ $value | humanizePercentage }} лимита памяти"
          description: "Больше 90 % лимита 10 минут: следующий рост убьёт процесс по OOM. Кто растёт: docker stats {{ $labels.container_name }}; потолок задаёт memory в infra/*.tf или observability_memory_mb."

      # Сервис запущен, но не отвечает — то же, что видит его healthcheck
      # Docker: API — /health, база, реплика и брокер — TCP-порт. Метка
      # service приходит из цели (prometheus.yml, job blackbox-services).
      - alert: ServiceProbeFailed
        expr: probe_success{job="blackbox-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} не отвечает на проверку"
          description: "Проба {{ $labels.instance }} падает 2 минуты подряд, хотя контейнер может быть запущен."

      # Публичный вход: интерфейс по HTTPS на адресе стенда. Падение здесь при
      # живом API — nginx интерфейса или сертификат.
      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-public"} == 0
        for: 3m
        labels:
          severity: critical
          service: ui
        annotations:
          summary: "Публичный вход {{ $labels.instance }} недоступен"
          description: "HTTPS-проба падает 3 минуты: пользователи не открывают кабинет."

      # Воркер не забирает задачи: потребителей у очереди ревью нет. Контейнер
      # при этом может быть запущен (завис на старте, потерял соединение).
      # Очереди нет совсем (воркер упал раньше, чем её объявил) — тоже
      # «никто не забирает», если сам брокер снимается.
      - alert: WorkerNotConsuming
        expr: |
          rabbitmq_queue_consumers{queue="review_jobs.qq"} == 0
          or (absent(rabbitmq_queue_consumers{queue="review_jobs.qq"}) unless on() (max_over_time(up{job="rabbitmq"}[5m]) == 0))
        for: 5m
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "У очереди review_jobs.qq нет потребителей"
          description: "5 минут ни один воркер не подписан на очередь: прогоны копятся и не выполняются."

      # Воркер подписан, но не работает: готовые задачи лежат 15 минут, и ни
      # одна не подтверждена. Подтверждений по очереди rabbitmq_prometheus не
      # отдаёт, только по типу очереди, а quorum-очередь на брокере одна:
      # review_jobs.qq (DLQ классическая). Условие на потребителя разводит
      # алерт с WorkerNotConsuming: два critical на одну беду не нужны. Рестарт
      # брокера обнуляет счётчик, increase() это переносит; рядов нет (брокер
      # не снимается), и алерт молчит, а горит ScrapeTargetDown. Окно без for:
      # for поверх окна удвоил бы срок до 30 минут, когда прогон уже выметен.
      - alert: WorkerStalled
        expr: |
          min_over_time(rabbitmq_queue_messages_ready{queue="review_jobs.qq"}[15m]) > 0
          and on() rabbitmq_queue_consumers{queue="review_jobs.qq"} > 0
          and on() sum(increase(rabbitmq_global_messages_acknowledged_total{queue_type="rabbit_quorum_queue"}[15m])) == 0
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "Воркер подписан на review_jobs.qq, но не берёт задачи"
          description: "15 минут в очереди лежат готовые задачи и нет ни одного подтверждения, хотя потребитель есть. Чаще всего это медленная модель или фоллбэк на текущем прогоне (тогда горит и ReviewJobStuck): смотреть спаны review.<этап> в Grafana. Если в спанах тишина, воркер завис: стек в логах, docker restart dmc268-worker (и dmc268-worker-N, если экземпляров несколько)."

      # Одна задача в работе дольше 20 минут: сообщение выдано и не
      # подтверждено, и подтверждений за окно нет, иначе это поток коротких
      # прогонов подряд. Прогоны на стенде укладываются в полторы минуты
      # (максимум 93 с на 105 прогонах); 20 минут набираются, только когда
      # вызовы модели уходят в таймаут с повтором. Выметатель переведёт прогон
      # в failed на 30 минутах (STALE_RUN_TIMEOUT_SECONDS), алерт приходит
      # раньше. critical: воркер берёт по сообщению (prefetch 1), и при одном
      # экземпляре, пока задача висит, не идёт ни одно ревью; warning же
      # глушил бы любой critical воркера, в том числе ReviewDlqNotEmpty,
      # который горит до ручного разбора DLQ. При нескольких экземплярах
      # (#99) висящая задача держит один, и пока остальные подтверждают свои,
      # алерт молчит: такой прогон доводит до failed выметатель.
      - alert: ReviewJobStuck
        expr: |
          min_over_time(rabbitmq_queue_messages_unacked{queue="review_jobs.qq"}[20m]) > 0
          and on() sum(increase(rabbitmq_global_messages_acknowledged_total{queue_type="rabbit_quorum_queue"}[20m])) == 0
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "Задача review_jobs.qq в работе дольше 20 минут"
          description: "Сообщение выдано воркеру 20 минут назад и не подтверждено. Сначала проверить, не идут ли вызовы модели в таймаут с повтором (спаны review.<этап>, шаг прогона: GET /api/v1/reviews/{id}/steps): такой прогон дойдёт сам. Через 30 минут без прогресса прогон переведёт в failed выметатель."

      # Скрейп цели падает: метрики этой цели, а с ними и алерты по ним, молчат.
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: "Prometheus не снимает {{ $labels.job }} ({{ $labels.instance }})"
          description: "Цель не отвечает 5 минут: алерты по её метрикам не сработают."

  - name: dmc268-errors
    rules:
      # Всплеск 5xx у API: доля за 5 минут больше 5 %. Нижний порог трафика —
      # одна ошибка при единичных запросах не алерт.
      - alert: Api5xxSpike
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{job="dmc-268-api", http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{job="dmc-268-api"}[5m]))
          ) > 0.05
          and sum(rate(http_server_request_duration_seconds_count{job="dmc-268-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Всплеск 5xx у API: {{ $value | humanizePercentage }} запросов"
          description: "Доля ответов 5xx за 5 минут выше 5 % уже 5 минут. Трейсы — в Grafana по X-Trace-ID из логов API."

      # Вебхук Stripe не принимает события (change stripe-topup): Stripe о падениях
      # нашего эндпоинта не сообщает, а в sandbox повторяет доставку всего 3 раза
      # за несколько часов — потом оплата так и останется незачисленной. Считаются
      # и 4xx: 400 — секрет не того назначения, 503 — приём выключен на стенде.
      # Только POST: GET на ту же ручку получает 405 с тем же http_route.
      # Событий мало (одно-два на пополнение), поэтому окно 6 часов. Ряд кода
      # появляется сразу с 1, и `increase()` первый отказ с кодом, ряда которого
      # в окне ещё не было, не видит (как у prime_run_outcomes, #324): горит со второго.
      # Отказ с кодом, ряд которого уже есть, виден сразу, и один такой без
      # принятых доставок зажигает алерт. Это допустимо: оплата не зачислена,
      # Stripe повторит, а следующий 200 (ряд 200 уже есть) опустит долю до
      # половины и погасит его.
      - alert: StripeWebhookFailing
        expr: |
          (
            sum(increase(http_server_request_duration_seconds_count{job="dmc-268-api", http_route="/api/v1/webhooks/stripe", http_request_method="POST", http_response_status_code=~"[45].."}[6h]))
            / sum(increase(http_server_request_duration_seconds_count{job="dmc-268-api", http_route="/api/v1/webhooks/stripe", http_request_method="POST"}[6h]))
          ) > 0.5
        labels:
          severity: warning
          # Свой service: критические алерты api (Api5xxSpike) иначе глушили бы его через inhibit_rules.
          service: stripe
        annotations:
          summary: "Вебхук Stripe отказывает: {{ $value | humanizePercentage }} доставок за 6 часов"
          description: "Больше половины доставок Stripe за 6 часов получили 4xx или 5xx — оплаты не зачисляются. Код ответа — в логах API по url.path /api/v1/webhooks/stripe: 400 — секрет назначения, 502 — ключ или API Stripe, 503 — секреты не заданы. Одни 400 и ни одного 200 бывают и от сканера, а не от Stripe: сверить с Event deliveries назначения в Workbench. Не дошедшие события отправить заново из Workbench (docs/LOCAL_RUN.md, «Пополнение через Stripe»)."

      # Прогоны падают в воркере, и 5xx у API этого не покажет: доля failed
      # среди завершённых за 30 минут больше 30 % при хотя бы трёх прогонах.
      # Отказы по балансу (refused) не ревью и в долю не входят: иначе
      # разбавили бы её и спрятали сбои.
      - alert: ReviewRunsFailing
        expr: |
          (
            sum(increase(review_runs_total{status="failed"}[30m]))
            / sum(increase(review_runs_total{status=~"completed|failed"}[30m]))
          ) > 0.3
          and sum(increase(review_runs_total{status=~"completed|failed"}[30m])) >= 3
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "Прогоны падают: {{ $value | humanizePercentage }} за 30 минут"
          description: "Доля прогонов в failed выше 30 %. Код ошибки шага — в GET /api/v1/reviews/{id}/steps и в спанах review.<этап>."

      # Массовый отказ по балансу: больше половины исходов за час — отказы, и их
      # хотя бы три. Одиночный отказ — норма (у плательщика кончились деньги),
      # массовый — ошибка оценки стоимости или снятый плательщик популярного
      # репозитория. Без этого алерта счётчик ревью просто падал бы к нулю.
      - alert: ReviewRunsRefused
        expr: |
          (
            sum(increase(review_runs_total{status="refused"}[1h]))
            / sum(increase(review_runs_total[1h]))
          ) > 0.5
          and sum(increase(review_runs_total{status="refused"}[1h])) >= 3
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "Прогоны отказаны по балансу: {{ $value | humanizePercentage }} за час"
          description: "Больше половины прогонов за час завершены без денег (coverage_reason = balance). Проверьте балансы и плательщиков репозиториев и оценку стоимости прогона."

      # Сообщение в DLQ — прогон, который никто не повторит: исключение при
      # обработке или лимит доставок.
      - alert: ReviewDlqNotEmpty
        expr: rabbitmq_queue_messages{queue="review_jobs.dlq"} > 0
        for: 5m
        labels:
          severity: critical
          service: worker
        annotations:
          summary: "В review_jobs.dlq {{ $value }} сообщений"
          description: "Сообщения лежат в DLQ дольше 5 минут. Разбор — rabbitmqadmin get queue=review_jobs.dlq в контейнере dmc268-rabbitmq, причина — в логах воркера."

  - name: dmc268-budget-alerts
    rules:
      # Расход токенов модели с начала месяца по прогонам (review_runs.tokens_used)
      # — receiver sqlquery коллектора (otelcol.yaml).
      - alert: LlmBudgetNearLimit
        expr: review_llm_tokens_month / on() group_left dmc268:llm_tokens_budget_month > 0.8
        labels:
          severity: warning
          service: llm
        annotations:
          summary: "Израсходовано {{ $value | humanizePercentage }} месячного бюджета токенов"
          description: "Расход токенов модели с начала месяца выше 80 % бюджета (dmc268:llm_tokens_budget_month в alerts.yml)."

      - alert: LlmBudgetExceeded
        expr: review_llm_tokens_month / on() group_left dmc268:llm_tokens_budget_month >= 1
        labels:
          severity: critical
          service: llm
        annotations:
          summary: "Месячный бюджет токенов исчерпан: {{ $value | humanizePercentage }}"
          description: "Расход токенов модели с начала месяца превысил бюджет. Провайдер может начать отклонять запросы (Eurorouter — 402)."

      # Без ряда расхода алерт бюджета молчит: sqlquery не может прочитать
      # базу (нет прав у роли мониторинга, база недоступна).
      - alert: LlmBudgetUnknown
        expr: absent(review_llm_tokens_month) unless on() (max_over_time(up{job="collector"}[5m]) == 0)
        for: 15m
        labels:
          severity: warning
          service: llm
        annotations:
          summary: "Расход токенов модели неизвестен"
          description: "Ряда review_llm_tokens_month нет 15 минут: коллектор не читает review_runs, алерт бюджета не работает. Смотрите логи dmc268-otelcol (receiver sqlquery)."

      # Стоимость вызовов модели с начала месяца по прогонам (review_runs.cost_eur) —
      # тот же receiver sqlquery; без ряда молчит вместе с токенами, и горит LlmBudgetUnknown.
      - alert: LlmCostBudgetNearLimit
        expr: review_llm_cost_eur_month / on() group_left dmc268:llm_cost_budget_eur_month > 0.8
        labels:
          severity: warning
          service: llm
        annotations:
          summary: "Израсходовано {{ $value | humanizePercentage }} месячного бюджета модели в евро"
          description: "Стоимость вызовов модели с начала месяца выше 80 % бюджета (dmc268:llm_cost_budget_eur_month в alerts.yml)."

      - alert: LlmCostBudgetExceeded
        expr: review_llm_cost_eur_month / on() group_left dmc268:llm_cost_budget_eur_month >= 1
        labels:
          severity: critical
          service: llm
        annotations:
          summary: "Месячный бюджет модели в евро исчерпан: {{ $value | humanizePercentage }}"
          description: "Стоимость вызовов модели с начала месяца превысила бюджет (dmc268:llm_cost_budget_eur_month в alerts.yml)."

      # Остаток на счёте Eurorouter — gauge воркера, опрос /credits раз в 5 минут.
      # Ниже 0,10 € провайдер отвечает 402, и прогоны падают. Нет ряда (опрос не
      # удался, Eurorouter не используется) — алерты молчат. Свой service: иначе
      # inhibit_rules глушили бы низкий баланс горящим до конца месяца бюджетом.
      - alert: LlmProviderBalanceLow
        expr: review_llm_provider_balance_eur < 5
        labels:
          severity: warning
          service: llm-provider
        annotations:
          summary: "Баланс Eurorouter {{ $value | printf \"%.2f\" }} €"
          description: "Остаток на счёте Eurorouter ниже 5 €: пополните баланс, пока провайдер не начал отвечать 402."

      - alert: LlmProviderBalanceCritical
        expr: review_llm_provider_balance_eur < 1
        labels:
          severity: critical
          service: llm-provider
        annotations:
          summary: "Баланс Eurorouter {{ $value | printf \"%.2f\" }} €"
          description: "Остаток на счёте Eurorouter ниже 1 €: ниже 0,10 € провайдер отвечает 402, и прогоны падают. Пополните баланс."

  - name: dmc268-storage
    rules:
      # Доля свободного места на файловых системах сервера: тома базы, WAL,
      # копий, Prometheus и Loki живут на одном диске (infra/README.md, «Диск»).
      # Селектор — в одном месте, пороги алертов ниже считаются поверх записи.
      # Файловые системы только для чтения (образы, erofs) всегда «полные» и
      # в них никто не пишет — они исключены по node_filesystem_readonly.
      - record: dmc268:filesystem_avail:ratio
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs", mountpoint!~"/(dev|run|sys|proc)(/.*)?"}
          / node_filesystem_size_bytes
          unless on(device, mountpoint) node_filesystem_readonly == 1

      - alert: DiskSpaceLow
        expr: dmc268:filesystem_avail:ratio < 0.15
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "На {{ $labels.mountpoint }} осталось {{ $value | humanizePercentage }}"
          description: "Свободно меньше 15 %. Кто растёт — docker system df -v на сервере."

      - alert: DiskSpaceCritical
        expr: dmc268:filesystem_avail:ratio < 0.05
        for: 2m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "Диск {{ $labels.mountpoint }} почти заполнен: {{ $value | humanizePercentage }} свободно"
          description: "Меньше 5 %: следующим остановится запись базы и WAL."

      # Рост томов: при текущей скорости диск кончится в ближайшие сутки.
      # Нижняя граница по свободному месту отсекает шум на почти пустом диске;
      # она же через запись оставляет только файловые системы из селектора.
      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes[6h], 24 * 3600) < 0
          and on(instance, device, mountpoint) dmc268:filesystem_avail:ratio < 0.4
        for: 30m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "{{ $labels.mountpoint }} заполнится меньше чем за сутки"
          description: "Свободное место убывает так, что через 24 часа его не останется (прогноз по 6 часам)."

  - name: dmc268-database
    rules:
      # Реплика не получает поток: строки в pg_stat_replication основного
      # сервера нет — метрика задержки пропадает. Тот же признак проверяет
      # healthcheck реплики (status walreceiver = streaming).
      - alert: ReplicaNotStreaming
        expr: absent(postgresql_replication_data_delay_bytes) unless on() (max_over_time(up{job="collector"}[5m]) == 0)
        for: 5m
        labels:
          severity: critical
          service: postgres-replica
        annotations:
          summary: "Реплика базы не получает поток WAL"
          description: "В pg_stat_replication основного сервера нет реплики 5 минут. Копии при этом снимаются с основного сервера (backup.sh), но горячего резерва нет."

      # Отставание реплики: WAL держится слотом на диске основного сервера до
      # max_slot_wal_keep_size (2 ГБ), дальше реплика отваливается насовсем.
      - alert: ReplicaLagHigh
        expr: max(postgresql_replication_data_delay_bytes) > 512 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          service: postgres-replica
        annotations:
          summary: "Реплика отстаёт на {{ $value | humanize1024 }}B"
          description: "Слот держит WAL на диске основного сервера; на 2 ГБ (max_slot_wal_keep_size) реплика потеряет поток и потребует пересоздания."

      # Свежей копии нет: отметку времени пишет backup.sh после успешного
      # pg_dump (textfile node-exporter). Порог — тот же, что у healthcheck
      # контейнера копий: сутки плюс два часа.
      - alert: BackupStale
        expr: time() - max(dmc268_backup_last_success_timestamp_seconds) > 26 * 3600
        labels:
          severity: critical
          service: postgres-backup
        annotations:
          summary: "Свежей резервной копии базы нет {{ $value | humanizeDuration }}"
          description: "Последний успешный pg_dump старше 26 часов. Причина — docker logs dmc268-postgres-backup."

      # Без поправки на лежащий node-exporter: unless сбрасывал бы for: 26h
      # при любом пропущенном скрейпе, и алерт не загорелся бы никогда. Если
      # node-exporter лежит сутки, второй critical рядом со ScrapeTargetDown
      # честен — отметки о копиях действительно нет.
      - alert: BackupStatusUnknown
        expr: absent(dmc268_backup_last_success_timestamp_seconds)
        for: 26h
        labels:
          severity: critical
          service: postgres-backup
        annotations:
          summary: "Нет отметки о резервной копии базы"
          description: "26 часов node-exporter не видит dmc268_backup_last_success_timestamp_seconds: копии не снимаются или не пишут отметку."

      # Копия вне сервера (db-backup.yml): отметку пишет job mark-success после
      # проверки восстановления, раз в сутки около 21:20 UTC. Порог — сутки плюс
      # 4 часа на задержки расписания GitHub. Отметки нет за всё окно — тоже
      # алерт: GitHub не запускает расписание или отметка не пишется. Без for,
      # поэтому лежащий node-exporter ничего не сбрасывает; его отсечка — чтобы
      # рядом со ScrapeTargetDown не горел второй алерт о том же. service тот
      # же, что у BackupStale: без свежей копии на сервере вынос и не идёт, и
      # critical BackupStale глушит это предупреждение (inhibit_rules).
      - alert: OffsiteBackupStale
        expr: |
          time() - max(dmc268_offsite_backup_last_success_timestamp_seconds) > 28 * 3600
          or (
            absent_over_time(dmc268_offsite_backup_last_success_timestamp_seconds[28h])
            unless on() (max_over_time(up{job="node-exporter"}[5m]) == 0)
          )
        labels:
          severity: warning
          service: postgres-backup
        annotations:
          summary: "Копия базы вне сервера не обновлялась больше 28 часов"
          description: "Нет успешного прогона db-backup.yml с проверкой восстановления: gh run list -w db-backup.yml. Прогонов нет совсем — расписание отключено или не запускается (gh workflow enable db-backup.yml)."

  - name: dmc268-tls
    rules:
      # Сертификат на IP — профиль shortlived Let's Encrypt, 160 часов;
      # nginx интерфейса продлевает его примерно на середине срока. Меньше
      # 48 часов — продление пропущено больше чем на сутки.
      - alert: TlsCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-public"} - time() < 48 * 3600
        for: 10m
        labels:
          severity: critical
          service: ui
        annotations:
          summary: "Сертификат {{ $labels.instance }} истекает через {{ $value | humanizeDuration }}"
          description: "Продление не прошло. Лог модуля ACME: docker logs dmc268-ui 2>&1 | grep -i acme."

  # Dead man's switch (#334). Если упал сам Prometheus или Alertmanager или у них
  # пропал выход наружу, алертов нет вовсе, и тишина в канале выглядит как
  # спокойный день. Поэтому Watchdog горит всегда, а Alertmanager шлёт его не в
  # Telegram, а раз в 5 минут на внешний heartbeat-сервис (receiver heartbeat в
  # alertmanager.yml). Пинги пропали — внешний сервис шумит в канал.
  # severity: none — не critical и не warning: inhibit_rules его не касаются, на
  # страницу статуса он не попадает (ALERT_RULES).
  - name: dmc268-watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Цепочка алертов работает"
          description: "Горит всегда, пока работают Prometheus и Alertmanager. Alertmanager шлёт его на внешний heartbeat-сервис, а не в Telegram: пропавшие пинги поднимают внешний сервис (infra/README.md, «Алерты»)."
      # Сломанная доставка в Telegram (токен отозван после ротации, бота убрали из чата):
      # heartbeat её не видит, пинг идёт мимо Telegram. Alertmanager шлёт этот алерт не в
      # Telegram, а на адрес /fail того же внешнего check — он сразу поднимает тревогу.
      - alert: AlertDeliveryFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total{integration="telegram"}[10m])) > 0
        labels:
          severity: critical
          service: alertmanager
        annotations:
          summary: "Алерты не доходят в Telegram"
          description: "Неудачных отправок в Telegram за 10 минут: {{ $value | humanize }}. Проверить секреты TELEGRAM_BOT_TOKEN_DMC268_T1 и TELEGRAM_CHAT_ID_DMC268_T1, что бот в канале, и лог Alertmanager (Notify attempt failed … receiver=telegram)."
