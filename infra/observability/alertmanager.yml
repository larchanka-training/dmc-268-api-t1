# Доставка алертов (#100): Alertmanager получает сработавшие правила от
# Prometheus (alerts.yml) и шлёт их в Telegram. Конфиг один и тот же локально
# и на стенде: токен бота и chat id — не в файле, а в отдельных файлах рядом
# (*_file). На стенде их заливает infra/observability.tf из секретов
# репозитория, локально — docker-compose.yml из переменных окружения. Без
# реальных значений Alertmanager работает, но доставка падает с ошибкой в его
# логе. Проверка доставки — infra/README.md, «Алерты».
#
# Dead man's switch (#334): Watchdog из alerts.yml горит всегда и уходит не в
# Telegram, а на внешний heartbeat-сервис (receiver heartbeat). Адрес — тоже
# файлом рядом, из необязательного секрета; без него — заглушка unset, и пинг
# падает с ошибкой в логе.

route:
  receiver: telegram
  # Один алерт на сервис и контейнер: падение одного контейнера не склеивается
  # с соседним в одно сообщение.
  group_by: [alertname, service, container_name, instance]
  group_wait: 30s
  group_interval: 5m
  # Горящий критический алерт повторяется раз в 4 часа, предупреждение — раз
  # в 12: забытый алерт не должен утонуть, но и не заспамить канал.
  repeat_interval: 4h
  routes:
    # Первым: Watchdog не должен дойти до Telegram. Пинг сразу (group_wait 0) и
    # раз в 5 минут, пока горит. Внешний сервис ждёт его с периодом 5 минут и
    # запасом 10 (infra/README.md, «Алерты»). group_interval — шаг, на котором
    # Alertmanager проверяет повтор: с 1m пинг уходит каждые 5–6 минут, а не
    # раз в 10, как было бы с group_interval 5m корневого маршрута.
    - matchers: ['alertname="Watchdog"']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
    - matchers: ['severity="warning"']
      receiver: telegram
      repeat_interval: 12h

# Критический алерт сервиса глушит его же предупреждения: при исчерпанном
# бюджете не нужно ещё и «80 %», при почти полном диске — «меньше 15 %».
# Диски — по точке монтирования: полный /boot не глушит «меньше 15 %» на /
# с томами базы. У алертов без mountpoint метки нет у обоих, Alertmanager
# считает такие значения равными — для них правило прежнее. ReviewDlqNotEmpty
# горит до ручного разбора DLQ и глушил бы предупреждения воркера всё это время.
inhibit_rules:
  - source_matchers: ['severity="critical"', 'alertname!="ReviewDlqNotEmpty"']
    target_matchers: ['severity="warning"']
    equal: [service, mountpoint]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: true
        # Простой текст: аннотации содержат <, > и &, а в HTML-режиме Telegram
        # отклоняет такое сообщение целиком.
        parse_mode: ""
        message: |-
          {{ if eq .Status "firing" }}🔴 {{ .CommonLabels.severity | toUpper }}{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  # Пинг внешнему heartbeat-сервису: POST с телом webhook Alertmanager, healthchecks.io
  # и аналоги принимают любой. Адрес — секрет (по нему пинг может прислать кто
  # угодно и скрыть падение), поэтому файлом. send_resolved не нужен: Watchdog
  # не гаснет, а пропадает вместе со стеком.
  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/heartbeat_url
        send_resolved: false
