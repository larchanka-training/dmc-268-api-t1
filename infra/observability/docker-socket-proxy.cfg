# Свой шаблон haproxy для socket-proxy (tecnativa/docker-socket-proxy v0.4.1) —
# урезанный вариант апстрим-конфига образа. Собранный образом из env вариант не
# годится: CONTAINERS=1 открывает ЛЮБОЙ GET под /containers — в том числе
# /containers/{id}/archive?path=… (любой файл любого контейнера, включая том
# Postgres), /export и inspect с полным Env (замечание ревью PR #130). Здесь
# разрешены только пути, которые берёт receiver docker_stats экземпляра
# коллектора otelcol-docker (проверено запуском через этот шаблон): список
# контейнеров (/containers/json), inspect (/containers/{id}/json), статистика
# (/containers/{id}/stats), события (/events — без них новые контейнеры не
# находятся, а в логе коллектора ошибка каждые 3 с), /info, /version и /_ping.
# Статистика и события отдают имя, образ, метки, цифры и командные строки
# docker exec — без Env и файлов.
# Остаточный риск: inspect контейнера отдаёт его Env (ключи S3 бэкапа, пароль
# репликации и т. д.). Поэтому клиент proxy один — otelcol-docker: входящего
# OTLP у него нет, и в сети proxy, кроме него и самого proxy, никого. Основной
# коллектор, который разбирает OTLP из сети данных и из интернета, до proxy
# не дотягивается. Командные строки docker exec видны в /events: секреты
# в них не передаём (infra/README.md, ротация пароля Grafana — через stdin).
#
# Механизм образа: entrypoint рендерит файл /usr/local/etc/haproxy/
# haproxy.cfg.template (sed подставляет адрес прослушивания вместо
# ${BIND_CONFIG}) в /tmp/haproxy.cfg и стартует `haproxy -W -db -f
# /tmp/haproxy.cfg`. Поэтому ${BIND_CONFIG} здесь остаётся плейсхолдером для
# sed, а $SOCKET_PATH и ${LOG_LEVEL} резолвит сам haproxy из окружения — их
# задаёт образ (/var/run/docker.sock и info). В compose шаблон монтируется
# read-only по этому пути, в infra заливается upload-ом.

global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    # 1h, а не 10m: поток /events молчит, пока нет событий, и по 10m haproxy
    # рвал бы его — ложный ERROR в логе коллектора каждые 10 минут.
    timeout client 1h
    timeout server 1h
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}

    # Только GET, дальше — единственная allow-строка: белый список путей
    # docker_stats выше. Всё остальное, включая /containers/{id}/archive и
    # /containers/{id}/logs, — 403.
    http-request deny unless METH_GET
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/(containers/json|containers/[^/]+/json|containers/[^/]+/stats|events|info|version|_ping)$ }
    http-request deny
    default_backend dockerbackend
