# Модули blackbox-exporter (#100): пробы, которые Prometheus запускает через
# него (job blackbox-services и blackbox-public в prometheus.yml).

modules:
  # /health API — то же, что проверяет healthcheck контейнера. 200 и ничего
  # больше: редирект или 503 — сервис не готов.
  http_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4

  # База, реплика и брокер: порт принимает соединения.
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  # Публичный вход по HTTPS: цепочка сертификата проверяется, срок — в
  # probe_ssl_earliest_cert_expiry (алерт TlsCertificateExpiringSoon).
  https_public:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
