# Третий экземпляр коллектора (dmc268-otelcol-logs): логи контейнеров без SDK —
# postgres, его реплики, rabbitmq (nginx интерфейса — из dmc-268-ui-t1) — от
# драйвера fluentd демона Docker.
# Почему так — infra/README.md, «Логи контейнеров». Конфиг один для compose и
# infra.

receivers:
  # Порт опубликован только на 127.0.0.1 хоста: подключается демон Docker.
  fluent_forward:
    endpoint: 0.0.0.0:24224

processors:
  # Потолок памяти; контейнеру задан лимит с запасом
  # (observability_memory_mb.collector_logs).
  memory_limiter:
    check_interval: 1s
    spike_limit_mib: 16
    limit_mib: 64

  # Имя сервиса — тег драйвера (имя контейнера); в ресурс его переносит
  # groupbyattrs/service основного коллектора. Тело — строка лога как есть,
  # поэтому редакция — по тексту, маркером. Вся редакция логов контейнеров
  # здесь: transform/redact-logs основного коллектора маскирует только записи
  # с exception.*.
  transform/container-logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["service.name"], attributes["fluent.tag"])
          - delete_key(attributes, "fluent.tag")
          # IPv4 где угодно в строке: клиент в начале access-лога nginx,
          # «client:» в его error-логе, адреса соединений rabbitmq.
          - replace_pattern(body, "[0-9]{1,3}([.][0-9]{1,3}){3}", "<скрыто>")
          # Пароль в тексте SQL: postgres пишет упавший запрос в STATEMENT.
          # Пароль роли мониторинга migrate.sh и миграция 0013 шлют литералом
          # (привязка на клиенте) — если ALTER ROLE упадёт, он окажется здесь.
          - replace_pattern(body, "(?i)password\\s+E?'.*", "PASSWORD '<скрыто>'")
          # Query в URL: коды OAuth (code, state) в запросе обратного вызова и
          # в Referer, как скрывает app/api/log_redaction.py. Query кончается
          # пробелом или кавычкой поля access-лога. Пароль скрыт раньше: в нём
          # тоже может быть «?».
          - replace_pattern(body, "[?][^ \"]+", "?<скрыто>")
          # DETAIL ошибок postgres со значениями ключей и строк таблиц. Прочие
          # DETAIL остаются как диагностика, хотя значения бывают и в них
          # (infra/README.md, «Логи контейнеров»).
          - 'replace_pattern(body, "DETAIL:  (Key |Failing row contains).*", "DETAIL:  <скрыто>")'

exporters:
  # Основному коллектору: там имя сервиса в ресурсе и отправка в Loki.
  otlp_http/collector:
    endpoint: http://collector:4318

service:
  # Свои метрики, как у основного коллектора (otelcol.yaml): job collector-logs-self.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [fluent_forward]
      processors: [memory_limiter, transform/container-logs]
      exporters: [otlp_http/collector]
