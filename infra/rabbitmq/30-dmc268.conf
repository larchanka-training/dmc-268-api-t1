# Пороги брокера в абсолютных числах (#150). Лимит памяти контейнера (512 МБ) брокер
# не видит и считал бы долю от памяти хоста: на стенде 0.6 × 8 ГБ = 5 ГБ, и OOM
# убил бы контейнер раньше, чем включится flow control. 300 МиБ оставляют запас
# под Erlang VM и пики сборки мусора.
vm_memory_high_watermark.absolute = 300MiB
# По умолчанию 50 МБ: диск кончился бы раньше, чем брокер заблокирует издателей.
disk_free_limit.absolute = 1GB
