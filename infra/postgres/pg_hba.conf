# Доступ к PostgreSQL стенда — и у основного сервера, и у реплики.
#
# Файл лежит вне каталога данных (hba_file в команде контейнера): pg_hba.conf
# внутри тома создаёт initdb один раз, и правка в образе до уже заведённого тома
# не дошла бы. Отсюда же правило для репликации — у образа по умолчанию
# репликация разрешена только с петли.
#
# samenet — подсети, к которым подключён сам сервер. База подключена только к
# внутренней сети стека (dmc268-backend), поэтому samenet — это ровно она:
# из сети интерфейса и из интернета до базы не дотянуться и маршрутом.

# TYPE  DATABASE     USER        ADDRESS       METHOD
local   all          all                       trust
host    all          all         127.0.0.1/32  trust
host    all          all         ::1/128       trust
host    replication  replicator  samenet       scram-sha-256
host    all          all         samenet       scram-sha-256
