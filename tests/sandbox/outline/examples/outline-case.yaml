    """Скидка на заказ."""
    from decimal import Decimal


    class Discount:
        """Скидка в процентах."""

        def __init__(self, percent: int) -> None:
            self.percent = percent

        @staticmethod
        def apply(price: Decimal, percent: int) -> Decimal:
            return price - price * percent / 100
  # Синтаксическая ошибка в total (строка 2): tree-sitter не падает: сигнатура total
  # захватывает обрывок тела, правка в average (строка 6) всё равно находит своё определение.
