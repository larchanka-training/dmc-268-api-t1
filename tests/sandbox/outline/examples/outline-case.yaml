# Мок-PR песочницы tree-sitter: по файлу на язык, правки заданы ключом lines:
# (путь -> "N", "N-M" или список через запятую). Эти строки - добавленные: база
# файла из lines: - тот же файл без них, дифф затрагивает ровно их; остальные
# файлы новые. Файлы до 8 КБ входят в дифф пакета целиком (whole_file) и AST им
# не нужен; app/orders/service.py больше порога - у него в пакете блок ast.
# Кейс читает и песочница воркера (make sandbox CASE_FILE=...): там ключ lines:
# игнорируется и все файлы новые.
title: Мультиязычный мок-PR
