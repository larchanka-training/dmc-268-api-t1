title: Поиск пользователя - SQL-инъекция и print
# categories у print: readability или correctness, как в кейсе 02. security
# не входит: окна ±3 строки у print и SQL-инъекции пересекаются, и второе
# замечание security про инъекцию засчиталось бы как найденный print.
pull_request:
  title: "feat: поиск пользователя по имени"
  description: Репозиторий пользователей получает поиск по имени для экрана поддержки.
files:
  app/repositories/users.py: |
    import logging

    logger = logging.getLogger(__name__)


    def find_user(cursor, name: str) -> tuple[int, str] | None:
        query = f"SELECT id, email FROM users WHERE name = '{name}'"

        cursor.execute(query)
        row = cursor.fetchone()

        print("найден пользователь", row)
        return row
expected:
  - id: sql-injection
    path: app/repositories/users.py
    contains: "query = f\"SELECT id, email FROM users"
    category: security
  - id: print
    path: app/repositories/users.py
    contains: "print(\"найден пользователь\""
    rule: [Logging, 1]
    categories: [readability, correctness]
