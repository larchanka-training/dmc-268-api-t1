# Runs the same checks CI runs, before a commit is created rather than
# after it is pushed. `language: system` on purpose: each hook calls straight
# into this project's own uv-managed venv, so the hook and CI always resolve
# the exact tool versions pinned in uv.lock — never a second, drifting copy
# pip-installed into pre-commit's own isolated environment.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]

      - id: lint-imports
        name: lint-imports (layering rule)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]

      # Та же версия openspec, что в CI: старые версии не проверяют длину
      # требований, и «локально зелено» расходилось бы с CI. Нужен Node с npx.
      - id: openspec-validate
        name: openspec validate --strict
        entry: npx --yes @fission-ai/openspec@1.14.2 validate --all --strict
        language: system
        pass_filenames: false
        files: ^openspec/

      # Схема API строится из кода: правка ручки, модели или enum'а домена меняет
      # docs/openapi/openapi.json. Хук перезаписывает файл; если он изменился,
      # pre-commit останавливает коммит — остаётся добавить файл и повторить.
      - id: export-openapi
        name: export openapi.json
        entry: uv run python scripts/export_openapi.py
        language: system
        pass_filenames: false
        files: ^(app/|scripts/export_openapi\.py$|docs/openapi/openapi\.json$)
