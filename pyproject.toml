[project]
name = "dmc-268-api-t1"
version = "0.1.0"
description = "FastAPI backend for DMC-268 Team 1"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    # fastapi's TestClient is starlette's, which needs httpx at import time.
    "httpx>=0.27",
    # grimp is import-linter's Rust-backed graph builder. From 3.16 its only
    # macOS arm64 wheel is the free-threaded cp314t build, so on an Apple
    # Silicon laptop uv falls back to maturin and wants a Rust toolchain.
    # Linux and Windows wheels are fine, so this cap is about laptops, not CI.
    # Capping grimp is what actually pins it; capping import-linter alone is
    # not enough, since 2.14 accepts any grimp.
    "import-linter>=2.0,<2.15",
    "grimp<3.16",
]

[tool.ruff]
target-version = "py314"
exclude = [".venv", "venv", ".git"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a live PostgreSQL; skipped when TEST_DATABASE_URL is unset",
]

# Enforces the dependency rule from BACKEND_ARCHITECTURE.md. Run with `lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
# ":" marks siblings that may import each other. api and infrastructure sit at
# the same level and are allowed to: the composition root lives in
# infrastructure and the app factory in api has to build it. What matters is
# that neither is reachable from application or domain.
layers = ["app.main", "app.api : app.infrastructure", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "The entrypoint stays thin"
type = "forbidden"
# app.main exists to call the factory. Naming it in the layers contract above
# only stops the layers importing it; this is what stops it reaching past the
# api layer into a repository or a session of its own.
source_modules = ["app.main"]
forbidden_modules = ["app.domain", "app.application", "app.infrastructure"]
# Direct imports only: reaching them through the factory is the whole point.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inner layers know no vendor"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = ["sqlalchemy", "fastapi", "httpx", "ollama", "pika", "alembic", "psycopg"]
