[project]
name = "dmc-268-api-t1"
version = "0.1.0"
description = "FastAPI backend for DMC-268 Team 1"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "pika>=1.4.4",
    # pyjwt + cryptography: подписание JWT RS256 для GitHub App.
    "pyjwt>=2.15.1",
    "cryptography>=50.0.1",
    # Транспорт VcsGateway к GitHub REST, не только TestClient в тестах.
    "httpx>=0.27",
    # Парсер AST-окружения изменённых строк. У ядра есть колёса cp314 под
    # macOS arm64 и manylinux x86_64/aarch64, грамматики собраны как abi3 —
    # компилятор в образе не нужен (change add-context-engine-and-repo-rules).
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "pydantic>=2.13",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    # Пакеты contrib — бета, и обе зависят от `opentelemetry-instrumentation` и
    # semconv одной серии с точным `==`, а SDK — от той же semconv: серия
    # обновляется целиком и осознанно. `instrument_engine` к тому же зовёт
    # внутренний `EngineTracer`, у которого нет обещаний совместимости.
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<0.67",
    "opentelemetry-instrumentation-httpx>=0.66b1,<0.67",
    # OTLP/HTTP-экспортёры трейсов (затем и метрик) — ядро OTel, версия идёт
    # в одной серии с SDK: обновляется вместе с ней.
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    # grimp is import-linter's Rust-backed graph builder. From 3.16 its only
    # macOS arm64 wheel is the free-threaded cp314t build, so on an Apple
    # Silicon laptop uv falls back to maturin and wants a Rust toolchain.
    # Linux and Windows wheels are fine, so this cap is about laptops, not CI.
    # Capping grimp is what actually pins it; capping import-linter alone is
    # not enough, since 2.14 accepts any grimp.
    "import-linter>=2.0,<2.15",
    "grimp<3.16",
    "mypy>=1.13",
    "pre-commit>=3.8",
    # Корпус eval правил (tests/eval/rules/corpus.py) читает кейсы из YAML.
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    # Транспорт TestClient Starlette: с httpx он предупреждает об устаревании.
    "httpx2>=2.16.0",
]

[tool.ruff]
target-version = "py314"
# tests/fixtures — исходники для парсера AST: их имена нарочно не определены.
exclude = [".venv", "venv", ".git", "tests/fixtures"]

[tool.ruff.lint]
# ruff 0.17 убрал правила о наивном `datetime` из набора по умолчанию, а время
# в коде — только UTC с часовым поясом: возвращаем их явно.
extend-select = ["DTZ"]

# `Depends(...)` as a FastAPI parameter default is the framework's own
# dependency-injection idiom (see .agents/templates/backend/endpoint.md),
# not the mutable-default-argument bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.14"
# Параллельная проверка: с 2.4 не experimental, на холодном кэше вдвое быстрее.
num_workers = "auto"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^venv/", "^tests/fixtures/"]

# Test functions and fixtures are not held to strict typing: pytest's own
# style (untyped fixtures, untyped `def test_x():`) is the norm, and forcing
# annotations there catches no bug strict mode exists to catch.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Живые тесты - платный вызов EUrouter: только явным `-m live` (workflow
# `llm-live.yml`), иначе `uv run pytest` без ключей всегда давал бы пропуски.
# Так же eval на живой модели (`eval.yml`) и полный нагрузочный прогон
# (`load.yml`): долгие, и их результат - отчёт, а не зелёная галочка.
# docker - валидация конфигов Docker-стека (`docker run`): нужен Docker
# на машине, в обычный прогон не входит.
# `-p tests.strict_skips` - «пропущенный тест = упавший» при PYTEST_FAIL_ON_SKIP=1
# (так в CI; локально - той же переменной), см. tests/strict_skips.py.
addopts = ["-m", "not live and not eval and not load and not docker", "-p", "tests.strict_skips"]
markers = [
    "integration: needs a live PostgreSQL; skipped when TEST_DATABASE_URL is unset",
    "live: paid call to the real EUrouter; skipped when EUROROUTER_API_KEYS is unset",
    "eval: rules eval on the live model (workflow eval.yml); needs EUrouter, PostgreSQL, RabbitMQ",
    "load: full load run with a report (workflow load.yml); needs PostgreSQL and RabbitMQ",
    "docker: needs Docker; run manually or in a separate CI step",
]

# Enforces the dependency rule from BACKEND_ARCHITECTURE.md. Run with `lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
# ":" marks siblings that may import each other. api, infrastructure and
# worker sit at the same level and are allowed to: the composition root lives
# in infrastructure, the app factory in api has to build it, and
# `app/worker/factory.py` builds the consume loop the same way `api/factory.py`
# builds the ASGI app. What matters is that none of the three is reachable
# from application or domain.
layers = ["app.main", "app.api : app.infrastructure : app.worker", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "The entrypoint stays thin"
type = "forbidden"
# app.main and app.worker.__main__ exist only to call their factory. Naming
# the package in the layers contract above only stops the layers importing
# it; this is what stops each thin entrypoint file reaching past its factory
# into a repository or a session of its own. `app.worker.factory` itself is
# deliberately not listed here — it is the factory, not the entrypoint, same
# role as `app.api.factory`.
source_modules = ["app.main", "app.worker.__main__"]
forbidden_modules = ["app.domain", "app.application", "app.infrastructure"]
# Direct imports only: reaching them through the factory is the whole point.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inner layers know no vendor"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "sqlalchemy", "fastapi", "httpx", "ollama", "pika", "alembic", "psycopg",
    # Парсер AST — только за портом DefinitionExtractor (спека context-assembly).
    "tree_sitter", "tree_sitter_python", "tree_sitter_javascript",
    "tree_sitter_typescript", "tree_sitter_go",
    # Трассировка — только за портом StageTracer (спека observability).
    "opentelemetry",
]

[dependency-groups]
dev = [
    "types-pika>=1.2.0b1",
]
