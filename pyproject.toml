[project]
name = "dmc-268-api-t1"
version = "0.1.0"
description = "FastAPI backend for DMC-268 Team 1"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
exclude = [".venv", "venv", ".git"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
