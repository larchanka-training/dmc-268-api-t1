schema: spec-driven

context: |
  Project: DMC-268 — automated AI code review system (GitLab Duo-like agent).
  This repo (dmc-268-api-t1) is the BACKEND service. The team board is GitHub
  Project https://github.com/orgs/larchanka-training/projects/7 (dmc-268-t1) —
  it aggregates issues from this repo (backend) and from
  larchanka-training/dmc-268-ui-t1 (frontend).

  Backend stack: Python, FastAPI, SQLAlchemy v2, Alembic, PostgreSQL, uv (package
  manager), ruff + pylint (lint), Ollama SDK (LLM gateway).
  System design: RabbitMQ (job queue), Redis (cache/idempotency, tentative),
  private sub-network between services, session in an httpOnly cookie, idempotency keys,
  rate limiting.
  Frontend (separate repo): TypeScript, React, pnpm, Vite + Vitest, eslint,
  zod, zustand.

  Domain model (from the review pipeline): Repository, MergeRequest, ReviewJob,
  ContextPayload, Finding/Comment.
  Pipeline: trigger (webhook / on-demand) -> context builder (unified diff +
  surrounding hunk context + whole-file when small + AST/import signatures)
  -> orchestrator/AI gateway (prompt assembly, auth, routing) -> LLM analysis
  (security / correctness / performance / readability) -> post-processing
  (diff-coordinate mapping, dedup, false-positive filtering, suggestions)
  -> publication (summary comment + inline discussions + status).

  Conventions: conventional commits; Clean/Hexagonal layering
  Router -> Service -> Repository -> LLM Gateway.

rules:
  design:
    - "Prefer the boring construct; justify any abstraction that has no second caller today."
    - "The HTTP API schema comes from code: an /api/v1 endpoint and all its responses are declared on the route (response_model, responses with error models from app/api/problems.py). docs/openapi/openapi.json is an export of that schema - never edited by hand; CI fails if it is stale. A planned endpoint is a stub route with its full schema that answers 501 NOT_IMPLEMENTED."
    - "Every error response follows RFC 9457 Problem Details (application/problem+json) with the code and trace_id extensions (trace_id is also the X-Trace-ID header); a new error code gets an ErrorCode value and its own Problem model with constants and an example in app/api/problems.py."
  tasks:
    - "Each task names the pure function or adapter it produces, so the split between decision logic and I/O stays visible in the plan."
    - "A change that adds or alters an /api/v1 endpoint or error ends its implementation tasks with regenerating docs/openapi/openapi.json (uv run python scripts/export_openapi.py)."

operations:
  apply:
    guidance:
      - "Follow DRY, KISS and YAGNI. Do not add a port, table, column, class or abstraction until a caller exists. When a ticket is explicitly architectural, describe the intended seam in the architecture document rather than committing unused code."
      - "Keep the architecture hexagonal. Domain and application layers depend on ports only; adapters live in infrastructure; dependencies point inward."
      - "Put decision logic in pure functions that take data and return data - state transitions, diff-anchor validation, deduplication, filtering, prompt assembly. No I/O, no clock reads, no randomness inside them; inject those as arguments."
      - "Keep adapters thin - translation between the external shape and the domain shape, with no branching business rules."
      - "Every pure function gets a unit test that runs without a database, broker or network. Reserve integration tests for adapters."
      - "Do not repeat an enum, a transition table or a timestamp definition in more than one place."
      - "Declare every endpoint response in code (response_model, responses with ERRORS_* from app/api/errors.py) and commit the regenerated docs/openapi/openapi.json with the route; never edit it by hand. Raise errors only as ApiError(status, ErrorCode.X, detail) from app/api/errors.py - never HTTPException or a hand-built JSON error body."
